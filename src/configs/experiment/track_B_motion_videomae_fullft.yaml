# @package _global_
# Track B — MotionVideoMAE full fine-tune (0 blocs gelés).
#
# motion_videomae (8 blocs gelés) → 32.5% à ep.18. Hypothèse : dégeler tous
# les 12 blocs avec un très faible LR backbone (LLRD + scale=0.02) peut
# extraire encore plus de signal temporel du backbone SSv2-pretrained.
# batch=8 + grad_accum=8 → effective batch=64 pour stabiliser l'optimisation.
defaults:
  - override /model: motion_videomae

model:
  num_frozen_blocks: 0
  dropout: 0.3

training:
  epochs: 60
  lr: 3.0e-4
  backbone_lr_scale: 0.02
  llrd_factor: 0.75
  batch_size: 8
  grad_accum_steps: 8
  weight_decay: 1.0e-3
  label_smoothing: 0.1
  warmup_epochs: 8
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.8
  color_strength: 0.3
  blur_prob: 0.1
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5
  use_mixup: true
  mixup_alpha: 0.3
