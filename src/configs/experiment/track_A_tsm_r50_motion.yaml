# @package _global_
# Track A — TSM_s ResNet-50 + motion-aware head (from scratch).
#
# Scale-up of track_A_tsm_motion (R34 → R50): 2048-dim features vs 512-dim.
# Head: [global, first, last, delta] (4×2048=8192) → Linear(8192,1024) → GELU → Linear(1024,33)
# head_hidden must be set to match the R50 feature dim automatically in TSM_s.
#
# Heavier regularisation vs R34: more params = more overfit risk.
# Reduced LR slightly — R50 gradients are noisier at batch_size=32.
defaults:
  - override /model: TSM_s

model:
  n_resnet_layers: 50
  fold_div: 8
  dropout: 0.5
  temporal_pool: motion
  use_frame_diff: true
  use_positional_encoding: true
  pe_mode: sinusoidal
  stochastic_depth: 0.20
  head_hidden: false

training:
  epochs: 120
  lr: 3.0e-4
  batch_size: 32           # R50 uses more memory than R34
  weight_decay: 3.0e-4
  label_smoothing: 0.1
  warmup_epochs: 10
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true

  use_augment: true
  color_prob: 0.5
  color_strength: 0.15
  blur_prob: 0.0

  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5

  use_mixup: true
  mixup_alpha: 0.4
  use_cutmix: true
  cutmix_alpha: 0.5
