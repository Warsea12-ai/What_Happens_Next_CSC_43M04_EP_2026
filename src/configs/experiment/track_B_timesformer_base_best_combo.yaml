# @package _global_
# TimeSformer-BASE-finetuned-SSv2 (vs la variante HR qui OOM à 23.3GB/24GB sur 3090).
#
# Variante base : 224×224, 14×14=196 patches par frame (vs 28×28=784 pour HR).
# Activations divisées par 4 → fit confortablement 24GB avec Prodigy + 0 frozen + batch=4.
#
# Pretraining SSv2 conservé (domaine "what happens next"), divided space-time
# attention conservée, juste résolution divisée par 2.
defaults:
  - override /model: timesformer_hr

model:
  backbone: "facebook/timesformer-base-finetuned-ssv2"
  num_frozen_blocks: 0
  n_temporal_layers: 2
  n_heads: 8
  dropout: 0.25
  head_hidden: 2048
  interp_mode: "aligned"

training:
  epochs: 20
  optimizer: prodigy
  lr: 1.0
  backbone_lr_scale: 0.5
  llrd_factor: 0.8
  batch_size: 4
  grad_accum_steps: 16
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 3
  min_lr: 1.0e-7
  clip_grad_norm: 1.0

  use_random_resized_crop: false
  use_augment: false
  color_prob: 0.0
  color_strength: 0.0
  blur_prob: 0.0
  flip_prob: 0.0
  use_temporal_map: false
  equivariant_reverse_prob: 0.0
  use_mixup: false
  mixup_alpha: 0.0

  early_stop_patience: 8
  num_workers: 2
