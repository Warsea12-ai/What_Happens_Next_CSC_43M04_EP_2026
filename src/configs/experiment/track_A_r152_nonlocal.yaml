# @package _global_
# Track A — R152 from scratch + Non-Local blocks + 8 frames.
#
# Combines the best backbone (R152, 0.4036) with global spatial self-attention.
# Non-local block after layer3[1]: ~2M extra params, but allows cross-spatial
# attention at 14×14 feature resolution (196 positions).
#
# Stochastic depth increased to 0.35 to offset the added capacity of NL blocks.
# batch_size=8: R152+NL requires ~18GB GPU memory at 224×224.
defaults:
  - override /model: TSM_s

dataset:
  num_frames: 8

model:
  pretrained: false
  n_resnet_layers: 152
  fold_div: 8
  dropout: 0.5
  temporal_pool: motion
  use_nonlocal: true
  use_frame_diff: true
  use_positional_encoding: true
  pe_mode: sinusoidal
  stochastic_depth: 0.35
  head_hidden: false

training:
  epochs: 120
  lr: 5.0e-4
  batch_size: 8
  gradient_accumulation_steps: 2
  weight_decay: 5.0e-4
  label_smoothing: 0.15
  warmup_epochs: 8
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.5
  color_strength: 0.15
  blur_prob: 0.0
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5
  use_mixup: true
  mixup_alpha: 0.8
  use_cutmix: true
  cutmix_alpha: 1.0
