# @package _global_
# SSv2 Base + 6 frozen blocks + équivariance temporelle maximale.
# La tâche est de prédire l'ordre temporel : l'augmentation par renversement
# équivariant (prob=0.9) force le modèle à apprendre des features directionnelles.
# Hypothèse : pousser très fort cette contrainte aide l'inférence temporelle.
defaults:
  - override /model: videomae

model:
  backbone: "MCG-NJU/videomae-base-finetuned-ssv2"
  num_frozen_blocks: 6
  dropout: 0.2

training:
  epochs: 80
  lr: 5.0e-5
  backbone_lr_scale: 0.1
  batch_size: 8
  grad_accum_steps: 4
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 8
  min_lr: 1.0e-7
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.8
  color_strength: 0.3
  blur_prob: 0.1
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.9
  use_mixup: true
  mixup_alpha: 0.4
