# @package _global_
# sweep_opt_prodigy v2 — base v1 atteint 52.74% top-1 / 81.53% top-5 sur requin (RTX 3090).
# v2 : exploite mieux le LR-free de Prodigy
#  - num_frozen_blocks 2 → 0 (full backbone trainable, Prodigy gère le LR par groupe)
#  - epochs 20 → 30 (Prodigy converge plus tard que AdamW à LR fixe)
#  - head_hidden 1024 → 2048 (plus de capacité tête)
#  - dropout 0.25 → 0.30, mixup 0.4 → 0.5, label_smoothing 0.1 → 0.15 (régul.+ pour compenser)
defaults:
  - override /model: videomae_cross_attn_pairs

model:
  backbone: "MCG-NJU/videomae-base-finetuned-ssv2"
  num_frozen_blocks: 0
  n_temporal_layers: 2
  n_heads: 8
  dropout: 0.30
  head_hidden: 2048

training:
  optimizer: prodigy
  epochs: 30
  lr: 1.0                          # ignoré par Prodigy mais doit être set
  backbone_lr_scale: 0.05
  llrd_factor: 0.80
  batch_size: 8
  grad_accum_steps: 8
  weight_decay: 5.0e-4
  label_smoothing: 0.15
  warmup_epochs: 3
  min_lr: 1.0e-7
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.8
  color_strength: 0.35
  blur_prob: 0.1
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.6
  use_mixup: true
  mixup_alpha: 0.5
