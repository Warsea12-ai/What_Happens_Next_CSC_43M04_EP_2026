# @package _global_
# Track A — Closed World (from scratch, no pretrained weights)
# Model: TSM with ResNet-34 backbone, residual temporal shift
#
# Augmentation rationale: heavy color jitter + blur hurts from-scratch training
# because the backbone has no prior and needs stable gradients to learn basic
# visual features first. Only keep mild color jitter + spatial augmentations.
# Temporal equivariance (flip + reverse) stays — it's free label-consistent signal.
defaults:
  - override /model: TSM

model:
  pretrained: false
  n_resnet_layers: 34
  fold_div: 8
  residual_shift: true
  use_frame_diff: true
  temporal_pool: attention
  use_positional_encoding: true
  pe_mode: sinusoidal

training:
  epochs: 80               # from-scratch needs more iterations than fine-tuning
  lr: 5.0e-4               # lower than before — AdamW + random init benefits from gentler start
  batch_size: 64           # larger batch = more stable BatchNorm statistics
  weight_decay: 1e-4
  label_smoothing: 0.1
  warmup_epochs: 10
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true

  use_augment: true
  color_prob: 0.5          # mild color jitter only
  color_strength: 0.15     # was 0.4 — too aggressive for from-scratch
  blur_prob: 0.0           # disabled: corrupts low-level features before backbone converges
  motion_blur_prob: 0.0
  pixelation_prob: 0.0

  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5
