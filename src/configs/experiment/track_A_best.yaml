# @package _global_
# Track A — Closed World (from scratch, no pretrained weights)
# Model: TSM with ResNet-34 backbone, residual temporal shift
#
# Augmentation rationale: heavy color jitter + blur hurts from-scratch training
# because the backbone has no prior and needs stable gradients to learn basic
# visual features first. Only keep mild color jitter + spatial augmentations.
# Temporal equivariance (flip + reverse) stays — it's free label-consistent signal.
defaults:
  - override /model: TSM

model:
  pretrained: false
  n_resnet_layers: 34
  fold_div: 8
  residual_shift: true
  use_frame_diff: true
  temporal_pool: attention
  use_positional_encoding: true
  pe_mode: sinusoidal

training:
  epochs: 60
  lr: 5.0e-4
  batch_size: 64
  weight_decay: 5.0e-4
  label_smoothing: 0.15
  warmup_epochs: 8
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true

  use_augment: true
  color_prob: 0.5
  color_strength: 0.15
  blur_prob: 0.0

  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5

  use_mixup: true
  mixup_alpha: 0.8
