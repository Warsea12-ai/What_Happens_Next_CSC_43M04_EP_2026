# @package _global_
# Track A — R101 from scratch + motion head + 8 frames.
#
# Fills the gap between R50 and R152. R101 is often the sweet spot for
# from-scratch training on medium-sized datasets: deeper than R50 but
# less prone to overfit than R152 (which has 3× more blocks in each stage).
# Stochastic depth 0.25 is heavier than R50 (0.20) to match the added depth.
defaults:
  - override /model: TSM_s

dataset:
  num_frames: 8

model:
  pretrained: false
  n_resnet_layers: 101
  fold_div: 8
  dropout: 0.5
  temporal_pool: motion
  use_frame_diff: true
  use_positional_encoding: true
  pe_mode: sinusoidal
  stochastic_depth: 0.25
  head_hidden: false

training:
  epochs: 120
  lr: 5.0e-4
  batch_size: 24
  weight_decay: 4.0e-4
  label_smoothing: 0.12
  warmup_epochs: 8
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.5
  color_strength: 0.15
  blur_prob: 0.0
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5
  use_mixup: true
  mixup_alpha: 0.6
  use_cutmix: true
  cutmix_alpha: 0.8
