# @package _global_
# V-JEPA 2 — augmentation forte (analogue à track_B_videomae_ssv2_aug)
# Même freezing que vjepa2_head, mais augmentation plus agressive.
defaults:
  - override /model: vjepa2_head
model:
  backbone: "facebook/vjepa2-vitg-fpc64-384-ssv2"
  num_frozen_blocks: 32
  dropout: 0.3
  head_hidden: 2048
training:
  epochs: 20
  lr: 1.0e-4
  backbone_lr_scale: 0.05
  llrd_factor: 0.80
  batch_size: 4
  grad_accum_steps: 16
  weight_decay: 5.0e-4
  label_smoothing: 0.15
  warmup_epochs: 3
  min_lr: 1.0e-7
  clip_grad_norm: 1.0
  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.9
  color_strength: 0.5
  blur_prob: 0.2
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.7
  use_mixup: true
  mixup_alpha: 0.8
