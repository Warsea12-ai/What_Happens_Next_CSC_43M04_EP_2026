# @package _global_
# V-JEPA 2 — LoRA rank 16 sur les 40 blocs (analogue à videomae_lora)
# Tous les blocs participent via leurs adapteurs LoRA (≈180M params entraînables)
# vs vjepa2_head qui ne touche que les 8 derniers blocs (202M).
# Hypothèse : accéder à TOUS les blocs via LoRA > accéder seulement aux derniers.
defaults:
  - override /model: vjepa2_variants
model:
  variant: "lora"
  num_frozen_blocks: 32   # inutilisé en mode lora mais requis par le config
  lora_rank: 16
  lora_alpha: 32.0
  dropout: 0.25
  head_hidden: 2048
training:
  epochs: 20
  lr: 1.0e-4
  backbone_lr_scale: 0.02
  llrd_factor: 0.0
  batch_size: 4
  grad_accum_steps: 16
  weight_decay: 0.05
  label_smoothing: 0.1
  warmup_epochs: 3
  min_lr: 1.0e-7
  clip_grad_norm: 1.0
  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.8
  color_strength: 0.35
  blur_prob: 0.1
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.6
  use_mixup: true
  mixup_alpha: 0.4
