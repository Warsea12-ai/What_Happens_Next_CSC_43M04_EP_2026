# @package _global_
# InternVideo2-Stage2-6B (OpenGVLab) — backbone vidéo natif 6B frozen + MLP head.
#
# Risque : modèle custom OpenGVLab, peut crash au load (trust_remote_code,
# flash_attn manquant, API divergente). On itère si nécessaire.
#
# Mémoire : 6B en BF16 = 12 GB poids + activations ~3-4 GB pour T=4 @ 224.
# Sur 24 GB GPU, batch_size=2 + grad_accum=32 (effectif 64).
defaults:
  - override /model: internvideo2

model:
  # Was Stage2_6B (multimodal, trust_remote_code 4.x-era, broken under
  # transformers 5.x). Switched to Stage1-1B-f8-SthSth — pure vision encoder,
  # non-gated, already SSv2-finetuned. (Despite the file name still saying
  # "_6b" for backwards compatibility with the experiment name.)
  backbone: "OpenGVLab/InternVideo2-Stage1-1B-224p-f8-SthSth"
  backbone_dtype: "bfloat16"
  dropout: 0.3
  head_hidden: 2048

training:
  epochs: 60
  lr: 5.0e-4
  backbone_lr_scale: 0.0
  llrd_factor: 0.0
  # 1B at bf16 ~ 2 GB weights → batch=4 with ~3-4 GB activations fits on
  # RTX A4000 16GB with several GB of headroom.
  batch_size: 4
  grad_accum_steps: 16       # effective batch = 64
  weight_decay: 5.0e-4
  label_smoothing: 0.05      # lower per wandb correlation analysis (rho=-0.43)
  warmup_epochs: 5
  min_lr: 1.0e-7
  clip_grad_norm: 1.0
  wandb_watch: false         # disable grad-mirror hook (saves ~1GB on 6B frozen backbone)

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.8
  color_strength: 0.35
  blur_prob: 0.1
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.6
  use_mixup: true
  mixup_alpha: 0.4
