# @package _global_
# Track A — X3D-XS from scratch (4 frames, 160px crop).
#
# X3D decomposes 3D convolutions across space, time, channel, width axes
# independently — very different inductive bias from TSM (which uses 2D convs
# with temporal shifts). Good ensemble diversity component.
#
# XS variant is designed for T=4 frames at 160×160 — matches our data exactly.
# SE channel attention + temporal attention pooling + auxiliary head are all on.
defaults:
  - override /model: X3D

model:
  variant: xs
  dropout: 0.5
  use_frame_diff: false
  stochastic_depth: 0.2

training:
  epochs: 100
  lr: 5.0e-4
  batch_size: 32           # 3D conv uses more memory than 2D TSM
  weight_decay: 5.0e-4
  label_smoothing: 0.15
  warmup_epochs: 10
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true

  use_augment: true
  color_prob: 0.5
  color_strength: 0.15
  blur_prob: 0.0

  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5

  use_mixup: true
  mixup_alpha: 0.8
