# @package _global_
# videomae_bblrs_003: PDF dégel doux (bblrs=0.03) + AdamW + wd=0.05 + aug + cw_valaware + EMA.
defaults:
  - override /model: videomae_cross_attn_pairs
model:
  backbone: "MCG-NJU/videomae-base-finetuned-ssv2"
  num_frozen_blocks: 0
  dropout: 0.25
  head_hidden: 2048
  interp_mode: "repeat"
training:
  epochs: 15
  optimizer: adamw
  lr: 1.0e-4
  backbone_lr_scale: 0.03
  llrd_factor: 1.0
  batch_size: 8
  grad_accum_steps: 4
  weight_decay: 5.0e-2
  label_smoothing: 0.1
  warmup_epochs: 3
  min_lr: 1.0e-7
  clip_grad_norm: 1.0
  wandb_watch: false
  use_ema: true
  ema_decay: 0.999
  class_weights: "val_aware"
  use_random_resized_crop: true
  rrc_scale_min: 0.7
  rrc_scale_max: 1.0
  use_augment: true
  color_prob: 0.5
  color_strength: 0.2
  blur_prob: 0.1
  flip_prob: 0.5
  use_temporal_map: false
  equivariant_reverse_prob: 0.0
  use_mixup: false
  mixup_alpha: 0.0
