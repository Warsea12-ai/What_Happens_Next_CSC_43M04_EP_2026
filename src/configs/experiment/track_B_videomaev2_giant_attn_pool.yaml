# @package _global_
# VideoMAE V2 Giant SSv2-finetuned — variante ATTN_POOL
# 32/40 blocs gelés, les 8 derniers + attention pooling trainables.
# Hypothèse : laisser un peu de capacité dans les couches hautes pour adapter
# la représentation au sous-ensemble de 33 classes.
defaults:
  - override /model: videomaev2_giant

model:
  variant: "attn_pool"
  num_frozen_blocks: 32
  head_hidden: 1024
  dropout: 0.25

training:
  epochs: 20
  lr: 1.0e-4
  backbone_lr_scale: 0.05
  llrd_factor: 0.85
  batch_size: 2
  grad_accum_steps: 32
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 3
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.6
  color_strength: 0.3
  blur_prob: 0.1
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.7
  use_mixup: true
  mixup_alpha: 0.4
