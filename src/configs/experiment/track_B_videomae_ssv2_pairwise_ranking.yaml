# @package _global_
# VideoMAEPairwiseRanking : branche contenu (espagne) + branche classement par paires.
#
# Observation empirique : espagne (MLP simple sur mean pool) bat toutes les
# tetes complexes testees avec backbone trop gele. Hypothese : VideoMAE-SSv2
# encode deja l'ordre temporel — une tete simple laisse le backbone libre.
#
# Innovation : ajouter une branche de CLASSEMENT PAR PAIRES en paralelle
# de la branche contenu (identique a espagne). Pour chaque paire (i,j) :
#   1. Cross-attention spatiale : frame_j interroge les 196 tokens de frame_i
#   2. Score scalaire s_{ij} = sigmoid(MLP(delta)) in [0,1]
#   3. 6 scores -> 33 logits via matrice d'affinite classe-paire (33x6)
#
# La matrice class_pair_weights est APPRISE : elle decouvre automatiquement
# quels patterns de preferences par paires correspondent a quelles classes.
# Pas besoin de connaitre la table permutation→classe.
#
# Propriete cle : si la branche ranking ne contribue pas, le modele degenere
# exactement vers espagne -> performance plancher garantie = 49.71%.
#
# Regularisation implicite : les classes avec des patterns d'ordre similaires
# partagent des poids class_pair similaires -> meilleure generalisation.
#
# Recette : 2frozen + LLRD 0.80 (identique a espagne).
defaults:
  - override /model: videomae_pairwise_ranking

model:
  backbone: "MCG-NJU/videomae-base-finetuned-ssv2"
  num_frozen_blocks: 2
  dropout: 0.25
  head_hidden: 1024
  rank_hidden: 64

training:
  epochs: 80
  lr: 1.0e-4
  backbone_lr_scale: 0.05
  llrd_factor: 0.80
  batch_size: 8
  grad_accum_steps: 8
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 10
  min_lr: 1.0e-7
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.8
  color_strength: 0.35
  blur_prob: 0.1
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.6
  use_mixup: true
  mixup_alpha: 0.4
