# @package _global_
# Track B — BidirectionalFramePairNet: symmetric before↔after cross-attention.
#
# Unlike the unidirectional FramePairNet (before→after only), this runs two
# parallel cross-attention streams:
#   forward:  before_patches attend to after_patches  ("what left the scene?")
#   backward: after_patches  attend to before_patches ("what entered the scene?")
# Both outputs are concatenated with the delta, giving the head a richer signal.
#
# Extra capacity cost: 2× the cross-attention params vs standard FramePairNet.
# FFN expansion 2× (vs 1× in FramePairNet) for more expressiveness.
defaults:
  - override /model: bidirectional_frame_pair

model:
  backbone: "Qwen/Qwen2-VL-2B-Instruct"
  n_cross_layers: 2
  n_heads: 8
  dropout: 0.3
  head_hidden: 512

training:
  epochs: 60
  lr: 3.0e-4
  # Same Qwen2-VL-2B backbone as qwen_temporal_attn, but with 2× cross-attention
  # streams this head needs more activation memory. batch=8 OOM'd in Adam.step()
  # on hongrie (16GB) at the very first optimizer step. Halve again to batch=4
  # and double accum to 16 to keep effective batch=64.
  batch_size: 4
  grad_accum_steps: 16
  weight_decay: 1.0e-4
  label_smoothing: 0.05      # lower per wandb correlation analysis (rho=-0.43)
  warmup_epochs: 5
  min_lr: 1.0e-6
  clip_grad_norm: 1.0
  wandb_watch: false         # disable grad-mirror hook on big frozen backbone

  use_random_resized_crop: false
  use_augment: true
  color_prob: 0.3
  flip_prob: 0.5
  use_mixup: false

  use_temporal_map: true
  equivariant_reverse_prob: 0.5
