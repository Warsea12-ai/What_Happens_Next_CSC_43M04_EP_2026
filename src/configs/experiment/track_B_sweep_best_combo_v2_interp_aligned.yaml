# @package _global_
# best_combo_v2 + interp_mode=aligned (le défaut historique, EXPLICITE pour
# l'A/B avec _interp_centered et _interp_repeat).
#
# Mode "aligned" : les 4 frames d'entrée sont placées aux positions [0, 5, 10, 15]
# de la sortie 16-frames ; F0 et F3 sont présentes telles quelles aux bords, les
# 12 positions intérieures sont des blends linéaires de paires adjacentes.
# Identique en tout point à track_B_sweep_best_combo_v2.yaml sauf l'expression
# explicite de interp_mode.
defaults:
  - override /model: videomae_cross_attn_pairs

model:
  backbone: "MCG-NJU/videomae-base-finetuned-ssv2"
  num_frozen_blocks: 0
  n_temporal_layers: 2
  n_heads: 8
  dropout: 0.25
  head_hidden: 2048
  interp_mode: "aligned"      # ← explicite (le défaut)

training:
  epochs: 20
  optimizer: prodigy
  lr: 1.0
  backbone_lr_scale: 0.5
  llrd_factor: 0.8
  batch_size: 8
  grad_accum_steps: 8
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 3
  min_lr: 1.0e-7
  clip_grad_norm: 1.0
  use_random_resized_crop: false
  use_augment: false
  color_prob: 0.0
  color_strength: 0.0
  blur_prob: 0.0
  flip_prob: 0.0
  use_temporal_map: false
  equivariant_reverse_prob: 0.0
  use_mixup: false
  mixup_alpha: 0.0
