# @package _global_
# Track B — VideoMAE-Base SSv2 + forte augmentation (variante 3/5).
#
# Combine le backbone SSv2 in-domain avec l'augmentation forte qui a aidé
# frozen_large_strong_aug (20.8%). Ici le backbone est aussi fine-tunable,
# la forte aug évite le surapprentissage pendant le fine-tuning long (80 eps).
defaults:
  - override /model: videomae

model:
  backbone: "MCG-NJU/videomae-base-finetuned-ssv2"
  num_frozen_blocks: 6
  dropout: 0.3

training:
  epochs: 80
  lr: 5.0e-5
  backbone_lr_scale: 0.1
  batch_size: 16
  grad_accum_steps: 4
  weight_decay: 5.0e-4
  label_smoothing: 0.12
  warmup_epochs: 8
  min_lr: 1.0e-7
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.8
  color_strength: 0.4
  blur_prob: 0.15
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.7
  use_mixup: true
  mixup_alpha: 0.5
