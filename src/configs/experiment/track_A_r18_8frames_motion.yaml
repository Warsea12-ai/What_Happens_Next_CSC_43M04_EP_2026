# @package _global_
# Track A — TSM-R18 + motion head + 8-frame sampling + full augmentation.
# Lightweight counterpart to track_A_r152_8frames — faster iteration.
# R18 with 8 frames previously scored 0.3766 (attention head, old recipe).
# Motion head + new recipe should push notably higher.
defaults:
  - override /model: TSM_s

dataset:
  num_frames: 8

model:
  n_resnet_layers: 18
  fold_div: 8
  dropout: 0.4
  temporal_pool: motion
  use_frame_diff: true
  use_positional_encoding: true
  pe_mode: sinusoidal
  stochastic_depth: 0.15
  head_hidden: false

training:
  epochs: 120
  lr: 5.0e-4
  batch_size: 64
  weight_decay: 2.0e-4
  label_smoothing: 0.1
  warmup_epochs: 8
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.5
  color_strength: 0.15
  blur_prob: 0.0

  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5

  use_mixup: true
  mixup_alpha: 0.3
