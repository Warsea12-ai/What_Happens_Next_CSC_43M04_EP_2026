# @package _global_
# MViT-V2 sweep variant: weight_decay 5e-3 (10x). Base = interp_repeat + EMA(0.999) + cw_valaware.
defaults:
  - override /model: mvit_v2_ssv2
model:
  backbone: "facebook/mvit-base-finetuned-ssv2"
  num_frozen_blocks: 0
  dropout: 0.25
  head_hidden: 1024
  interp_mode: "repeat"
training:
  epochs: 15
  optimizer: prodigy
  lr: 1.0
  backbone_lr_scale: 0.5
  llrd_factor: 0.8
  batch_size: 4
  grad_accum_steps: 8
  weight_decay: 5.0e-3
  label_smoothing: 0.1
  warmup_epochs: 2
  min_lr: 1.0e-7
  clip_grad_norm: 1.0
  use_ema: true
  ema_decay: 0.999
  class_weights: "val_aware"
  use_random_resized_crop: false
  use_augment: false
  color_prob: 0.0
  color_strength: 0.0
  blur_prob: 0.0
  flip_prob: 0.0
  use_temporal_map: false
  equivariant_reverse_prob: 0.0
  use_mixup: false
  mixup_alpha: 0.0
