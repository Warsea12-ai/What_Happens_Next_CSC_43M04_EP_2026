# @package _global_
# Track A — TSM_s ResNet-18, tuned for ~50k videos (overfits after ~30 epochs).
#
# Regularisation strategy: strong MixUp (alpha=0.8) + high dropout +
# stochastic depth 0.25 + weight decay 5e-4. Together these push the overfitting
# cliff from ~epoch 30 to ~epoch 60, giving the model more time to generalise.
defaults:
  - override /model: TSM_s

model:
  pretrained: false
  n_resnet_layers: 18
  fold_div: 8
  dropout: 0.5
  temporal_pool: attention
  use_frame_diff: true
  use_positional_encoding: true
  pe_mode: sinusoidal
  stochastic_depth: 0.25
  head_hidden: false

training:
  epochs: 60
  lr: 5.0e-4
  batch_size: 64
  weight_decay: 5.0e-4
  label_smoothing: 0.15
  warmup_epochs: 8
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true

  use_augment: true
  color_prob: 0.5
  color_strength: 0.15
  blur_prob: 0.0

  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5

  use_mixup: true
  mixup_alpha: 0.8    # high alpha = very blended labels = strong regulariser
