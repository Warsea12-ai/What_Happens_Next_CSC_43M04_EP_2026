# @package _global_
# Track A — TSM_s with ResNet-18, stochastic depth, CutMix+MixUp.
#
# Key differences from track_A_best (TSM ResNet-34):
#   - ResNet-18 (smaller, less overfitting on 50k videos)
#   - Stochastic depth 0.15 (extra regularisation)
#   - CutMix + MixUp alternating (best practice for action recognition)
#   - Longer training (120 epochs) with stronger weight decay
#   - Sinusoidal PE (no learned PE params to overfit)
defaults:
  - override /model: TSM_s

model:
  pretrained: false
  n_resnet_layers: 18
  fold_div: 8
  dropout: 0.4
  temporal_pool: attention
  use_frame_diff: true
  use_positional_encoding: true
  pe_mode: sinusoidal
  stochastic_depth: 0.15
  head_hidden: false

training:
  epochs: 120
  lr: 5.0e-4
  batch_size: 64
  weight_decay: 2.0e-4
  label_smoothing: 0.1
  warmup_epochs: 10
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true

  use_augment: true
  color_prob: 0.5
  color_strength: 0.15
  blur_prob: 0.0

  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5

  use_mixup: true
  mixup_alpha: 0.3
  use_cutmix: true
  cutmix_alpha: 0.4
