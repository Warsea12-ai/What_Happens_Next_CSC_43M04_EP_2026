# @package _global_
# FactorSTNet with R101 backbone + temporal equivariance.
# Bigger CNN capacity; same divided space-time transformer.
# use_temporal_map: training with reversed videos + swapped labels
# gives free extra supervision from the 13 reversal pairs.
defaults:
  - override /model: factor_st_net

dataset:
  num_frames: 4

model:
  n_resnet_layers: 101
  backbone_variant: resnet
  proj_dim: 256
  n_blocks: 4
  n_heads: 8
  dropout: 0.4

training:
  epochs: 120
  lr: 4.0e-4
  batch_size: 24
  weight_decay: 3.0e-4
  label_smoothing: 0.15
  warmup_epochs: 15
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.5
  color_strength: 0.15
  blur_prob: 0.0
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5

  use_mixup: true
  mixup_alpha: 0.8
