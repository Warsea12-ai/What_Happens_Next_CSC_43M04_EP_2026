# @package _global_
# FactorSTNet R50, 150 epochs, full temporal equivariance.
# Extra training time + equivariance augmentation for the trajectory model.
defaults:
  - override /model: factor_st_net

dataset:
  num_frames: 4

model:
  n_resnet_layers: 50
  backbone_variant: resnet
  proj_dim: 256
  n_blocks: 4
  n_heads: 8
  dropout: 0.35

training:
  epochs: 150
  lr: 5.0e-4
  batch_size: 32
  weight_decay: 3.0e-4
  label_smoothing: 0.12
  warmup_epochs: 15
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.5
  color_strength: 0.15
  blur_prob: 0.0
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5

  use_mixup: true
  mixup_alpha: 0.8
  use_cutmix: true
  cutmix_alpha: 1.0
