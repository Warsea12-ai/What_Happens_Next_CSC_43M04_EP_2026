# @package _global_
# Triple stack VideoMAE : interp_centered + EMA(0.999) + class_weights="auto_confusion".
# Les 3 leviers viennent de familles différentes :
#   - interp_centered : pré-traitement temporel
#   - EMA            : smoothing post-optimization
#   - class_weights  : objectif de loss
# Si gain additif : ~0.755-0.765 attendu.
defaults:
  - override /model: videomae_cross_attn_pairs

model:
  backbone: "MCG-NJU/videomae-base-finetuned-ssv2"
  num_frozen_blocks: 0
  n_temporal_layers: 2
  n_heads: 8
  dropout: 0.25
  head_hidden: 2048
  interp_mode: "centered"

training:
  epochs: 20
  optimizer: prodigy
  lr: 1.0
  backbone_lr_scale: 0.5
  llrd_factor: 0.8
  batch_size: 8
  grad_accum_steps: 8
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 3
  min_lr: 1.0e-7
  clip_grad_norm: 1.0

  use_ema: true
  ema_decay: 0.999
  class_weights: "auto_confusion"

  use_random_resized_crop: false
  use_augment: false
  color_prob: 0.0
  color_strength: 0.0
  blur_prob: 0.0
  flip_prob: 0.0
  use_temporal_map: false
  equivariant_reverse_prob: 0.0
  use_mixup: false
  mixup_alpha: 0.0
