# @package _global_
# Multi-axis investigation: keep ONLY motion-related augmentations,
# turn OFF appearance-only ones. Tests whether the harm comes from appearance
# augs (color/blur/RRC) — which alter pixel statistics that the SSv2-pretrained
# backbone already learned — or from motion augs.
#   KEEP:  flip, temporal-reverse equivariance, mixup
#   OFF:   color jitter, gaussian blur, RandomResizedCrop
defaults:
  - override /model: videomae_cross_attn_pairs

model:
  backbone: "MCG-NJU/videomae-base-finetuned-ssv2"
  num_frozen_blocks: 2
  n_temporal_layers: 2
  n_heads: 8
  dropout: 0.25
  head_hidden: 1024

training:
  epochs: 20
  lr: 1.0e-4
  backbone_lr_scale: 0.05
  llrd_factor: 0.8
  batch_size: 8
  grad_accum_steps: 8
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 3
  min_lr: 1.0e-7
  clip_grad_norm: 1.0

  # APPEARANCE AUGS OFF
  use_random_resized_crop: false
  use_augment: true
  color_prob: 0.0
  color_strength: 0.0
  blur_prob: 0.0

  # MOTION AUGS KEPT
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.6
  use_mixup: true
  mixup_alpha: 0.4
