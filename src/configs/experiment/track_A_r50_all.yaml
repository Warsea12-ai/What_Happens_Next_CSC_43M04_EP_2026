# @package _global_
# Track A — R50 full kitchen sink: multiscale + nonlocal + transformer + 16 frames.
#
# All architectural improvements on R50 (faster/cheaper version of the r152_best_combo):
#   multiscale:  layer2+3+4 fusion → 3584-D temporal features
#   nonlocal:    global spatial attention in layer3
#   transformer: 2-layer MHSA temporal aggregation over T=16
#   16 frames:   maximum temporal resolution
#
# Why R50 and not R152: R152 + all features requires batch_size=4 (very slow).
# R50 + all features fits batch_size=8 with gradient accumulation.
# If this matches or beats r152_best_combo, R50 is the winner.
defaults:
  - override /model: TSM_s

dataset:
  num_frames: 16

model:
  pretrained: false
  n_resnet_layers: 50
  fold_div: 8
  dropout: 0.45
  temporal_pool: transformer
  use_nonlocal: true
  use_frame_diff: true
  use_positional_encoding: true
  pe_mode: sinusoidal
  stochastic_depth: 0.25
  head_hidden: false
  use_multiscale: true

training:
  epochs: 120
  lr: 5.0e-4
  batch_size: 8
  gradient_accumulation_steps: 2
  weight_decay: 3.0e-4
  label_smoothing: 0.1
  warmup_epochs: 10
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.5
  color_strength: 0.15
  blur_prob: 0.0
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5
  use_mixup: true
  mixup_alpha: 0.6
  use_cutmix: true
  cutmix_alpha: 0.8
