# @package _global_
# VideoMAE-Small SSv2 — LoRA rank 8 + augmentations agressives (mixup 0.6, color 0.8).
defaults:
  - override /model: videomae_lora

model:
  backbone: "MCG-NJU/videomae-small-finetuned-ssv2"
  lora_rank: 8
  lora_alpha: 16.0
  dropout: 0.4
  head_hidden: 512

training:
  epochs: 40
  lr: 2.5e-4
  backbone_lr_scale: 0.1
  batch_size: 16
  grad_accum_steps: 4
  weight_decay: 2.0e-4
  label_smoothing: 0.15
  warmup_epochs: 5
  min_lr: 1.0e-6
  clip_grad_norm: 1.0
  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.8
  color_strength: 0.4
  blur_prob: 0.2
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.7
  use_mixup: true
  mixup_alpha: 0.6
