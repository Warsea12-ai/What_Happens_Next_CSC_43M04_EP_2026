# @package _global_
# MViT-V2 + augmentations spatiales (RRC + color + blur + flip) sur la recette
# top (cw_valaware + repeat + EMA). Hypothèse : MViT (inductive bias temporel)
# peut absorber l'augmentation différemment de VideoMAE (où aug a aidé sur
# val_dir).
defaults:
  - override /model: mvit_v2_ssv2
model:
  backbone: "facebook/mvit-base-finetuned-ssv2"
  num_frozen_blocks: 0
  dropout: 0.15
  head_hidden: 1024
  interp_mode: "repeat"
training:
  epochs: 15
  optimizer: prodigy
  lr: 1.0
  backbone_lr_scale: 0.5
  llrd_factor: 0.8
  batch_size: 4
  grad_accum_steps: 8
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 2
  min_lr: 1.0e-7
  clip_grad_norm: 1.0
  use_ema: true
  ema_decay: 0.999
  class_weights: "val_aware"
  use_random_resized_crop: true
  rrc_scale_min: 0.7
  rrc_scale_max: 1.0
  use_augment: true
  color_prob: 0.5
  color_strength: 0.25
  blur_prob: 0.15
  flip_prob: 0.5
  use_temporal_map: false
  equivariant_reverse_prob: 0.0
  use_mixup: false
  mixup_alpha: 0.0
