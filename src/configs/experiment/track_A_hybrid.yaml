# @package _global_
# Track A — CNNHybrid: explicit direction signals + learned temporal attention
# sharing a single ResNet34 backbone (from scratch).
#
# Direction path (CNNTemporal): global_avg | avg_diff | net_dir  → 3×512
# Attention path (VideoTransformer): 2-layer CLS transformer      → 256
# Combined: 1792 → head → 33
defaults:
  - override /model: cnn_hybrid

model:
  backbone: resnet18
  d_model: 128
  nhead: 4
  num_layers: 1
  dropout: 0.4
  head_dim: 256

training:
  epochs: 80
  lr: 5.0e-4
  batch_size: 64
  weight_decay: 1e-4
  label_smoothing: 0.1
  warmup_epochs: 8
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true

  use_augment: true
  color_prob: 0.5
  color_strength: 0.15
  blur_prob: 0.0

  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5

  use_mixup: true
  mixup_alpha: 0.2
