# @package _global_
# SSv2 Base + 2 frozen blocks seulement (fine-tune 10 blocs sur 12).
# Plus agressif que ssv2_4frozen (8 blocs), presque full fine-tune.
# LLRD 0.8 : protège les couches basses du catastrophic forgetting.
# Hypothèse : quasi full fine-tune + LLRD ≈ full fine-tune sans explosion de gradient.
defaults:
  - override /model: videomae

model:
  backbone: "MCG-NJU/videomae-base-finetuned-ssv2"
  num_frozen_blocks: 2
  dropout: 0.25

training:
  epochs: 60
  lr: 1.0e-4
  backbone_lr_scale: 0.05
  llrd_factor: 0.80
  batch_size: 8
  grad_accum_steps: 8
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 10
  min_lr: 1.0e-7
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.8
  color_strength: 0.35
  blur_prob: 0.1
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.6
  use_mixup: true
  mixup_alpha: 0.4
