# @package _global_
# Track B — ViT-B/16 (ImageNet pretrained) + temporal transformer
# Why better than Swin3D: Swin3D collapses T=4 → T=1 in early 3D stages.
# ViT processes each frame independently; all 4 frame tokens reach the temporal head.
defaults:
  - override /model: vit_temporal

model:
  pretrained: true
  num_frozen_blocks: 6   # fine-tune last 6 of 12 blocks (was 8→4 too few to adapt to direction)
  dropout: 0.3
  temporal_layers: 2
  temporal_heads: 8

training:
  epochs: 150              # extension après early-stop @ ~30 epochs sur barlia (val 0.5554)
  early_stop_patience: 20  # 6 → 20 : laisse plus de chances de sortir d'un plateau
  early_stop_min_gain: 0.005  # 0.01 → 0.005 : tolère un progrès plus lent
  lr: 1.0e-4             # head LR (temporal transformer)
  backbone_lr_scale: 0.1 # last-6-block LR = 1e-5
  batch_size: 16          # ViT-B + 4 frames needs ~12GB; reduce if OOM
  weight_decay: 1e-4
  label_smoothing: 0.1
  warmup_epochs: 5        # was 10 — pretrained model doesn't need long warmup
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true

  use_augment: true
  color_prob: 0.8
  color_strength: 0.3
  blur_prob: 0.1

  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5
