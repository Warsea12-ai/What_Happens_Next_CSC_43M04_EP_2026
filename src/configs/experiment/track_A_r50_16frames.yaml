# @package _global_
# Track A — R50 from scratch + 16 frames + motion head.
#
# Companion to r152_16frames: tests whether 16-frame benefit is backbone-agnostic
# or specific to R152's depth. R50 trains faster at T=16 (batch_size=16 vs 8).
# If R50+16 beats R50+8 by the same margin as R152+16 vs R152+8, the gain
# comes purely from temporal resolution and will compound with backbone depth.
defaults:
  - override /model: TSM_s

dataset:
  num_frames: 16

model:
  pretrained: false
  n_resnet_layers: 50
  fold_div: 8
  dropout: 0.45
  temporal_pool: motion
  use_frame_diff: true
  use_positional_encoding: true
  pe_mode: sinusoidal
  stochastic_depth: 0.22
  head_hidden: false

training:
  epochs: 120
  lr: 5.0e-4
  batch_size: 16
  weight_decay: 3.0e-4
  label_smoothing: 0.1
  warmup_epochs: 8
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.5
  color_strength: 0.15
  blur_prob: 0.0
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5
  use_mixup: true
  mixup_alpha: 0.6
  use_cutmix: true
  cutmix_alpha: 0.8
