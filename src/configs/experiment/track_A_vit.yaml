# @package _global_
# Track A — VideoTransformer: ResNet34 backbone + learned temporal attention
# CLS token aggregates T=4 frame tokens via 2-layer pre-norm transformer
defaults:
  - override /model: video_transformer

model:
  backbone: resnet34
  d_model: 256
  nhead: 4
  num_layers: 2
  dropout: 0.3

training:
  epochs: 50
  lr: 0.001
  batch_size: 64
  weight_decay: 1e-4
  label_smoothing: 0.1
  warmup_epochs: 5
  min_lr: 1.0e-5
  clip_grad_norm: 1.0

  use_random_resized_crop: true

  use_augment: true
  color_prob: 0.8
  color_strength: 0.3
  blur_prob: 0.1
  motion_blur_prob: 0.1
  pixelation_prob: 0.1

  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5
