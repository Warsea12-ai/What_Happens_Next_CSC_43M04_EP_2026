# @package _global_
# Track A — VideoTransformer: ResNet34 backbone + learned temporal attention
# CLS token aggregates T=4 frame tokens via 2-layer pre-norm transformer.
#
# Key difference from CNNTemporal: attention learns the temporal combination
# rather than using hand-crafted avg/diff/net_dir signals.
# d_model=512 matches ResNet34 feature dim — no information loss on projection.
defaults:
  - override /model: video_transformer

model:
  backbone: resnet34
  d_model: 512
  nhead: 8
  num_layers: 2
  dropout: 0.3

training:
  epochs: 80
  lr: 5.0e-4
  batch_size: 64
  weight_decay: 1e-4
  label_smoothing: 0.1
  warmup_epochs: 8
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true

  use_augment: true
  color_prob: 0.5
  color_strength: 0.15
  blur_prob: 0.0
  motion_blur_prob: 0.0
  pixelation_prob: 0.0

  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5
