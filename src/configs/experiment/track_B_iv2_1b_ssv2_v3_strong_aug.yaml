# @package _global_
# InternVideo2-1B-SthSth v3 : augmentations renforcées (mixup 0.6, color 0.5)
# 3 archis SSv2-FT × 3 variantes — 20 epochs, 130W.
defaults:
  - override /model: internvideo2

model:
  backbone: "OpenGVLab/InternVideo2-Stage1-1B-224p-f8-SthSth"
  backbone_dtype: "bfloat16"
  dropout: 0.3
  head_hidden: 2048

training:
  epochs: 20
  lr: 1.0e-4
  backbone_lr_scale: 0.05
  llrd_factor: 0.8
  batch_size: 2
  grad_accum_steps: 32
  weight_decay: 5.0e-4
  label_smoothing: 0.15
  warmup_epochs: 3
  min_lr: 1.0e-7
  clip_grad_norm: 1.0
  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.8
  color_strength: 0.5
  blur_prob: 0.1
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.6
  use_mixup: true
  mixup_alpha: 0.6
