# @package _global_
# TimesFormer-Base SSv2-finetuned (88M, 59.5% reported). 224x224, FROZEN variant.
# Pour 130W (RTX 4000 Ada 20GB) — fit largement avec batch 8.
defaults:
  - override /model: timesformer_ssv2

model:
  variant: "frozen"
  backbone: "facebook/timesformer-base-finetuned-ssv2"
  num_frames: 8
  image_size: 224
  head_hidden: 1024
  dropout: 0.3

training:
  epochs: 30
  lr: 5.0e-4
  batch_size: 8
  grad_accum_steps: 8
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 3
  min_lr: 1.0e-6
  clip_grad_norm: 1.0
  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.6
  color_strength: 0.3
  blur_prob: 0.1
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.6
  use_mixup: true
  mixup_alpha: 0.3
