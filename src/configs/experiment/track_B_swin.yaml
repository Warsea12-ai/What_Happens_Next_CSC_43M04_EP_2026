# @package _global_
# Track B — Video Swin-3D-S fine-tuned from Kinetics400
# Differential LR: backbone 10x smaller than head
defaults:
  - override /model: swin3d_finetune

model:
  pretrained: true
  dropout: 0.5

training:
  epochs: 30
  lr: 1.0e-4          # head LR
  backbone_lr_scale: 0.1  # backbone gets lr * 0.1 = 1e-5
  batch_size: 16
  weight_decay: 1e-4
  label_smoothing: 0.1
  warmup_epochs: 10   # long warmup to protect pretrained weights
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true

  use_augment: true
  color_prob: 0.8
  color_strength: 0.3
  blur_prob: 0.1

  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5
