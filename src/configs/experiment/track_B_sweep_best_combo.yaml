# @package _global_
# Combined-winners run — stacks the 5 single-axis winners from yesterday's sweep:
#   aug_off       (+5.71pp)   → all augmentation off
#   bblrs02       (+5.68pp)   → backbone_lr_scale=0.2 (4× default)
#   frozen0       (+4.04pp)   → 0 frozen blocks (full backbone unfreeze)
#   lr_3e4        (+3.39pp)   → lr=3e-4 (3× default)
#   head2048      (+2.03pp)   → head_hidden=2048 (2× default)
# If gains compound (or even just add partially) we should see ≥0.70 val_acc,
# possibly 0.72+, vs the per-axis maxima of 0.671.
defaults:
  - override /model: videomae_cross_attn_pairs

model:
  backbone: "MCG-NJU/videomae-base-finetuned-ssv2"
  num_frozen_blocks: 0       # was 2 — frozen0 won
  n_temporal_layers: 2
  n_heads: 8
  dropout: 0.25
  head_hidden: 2048          # was 1024 — head2048 won

training:
  epochs: 20
  lr: 3.0e-4                 # was 1e-4 — lr_3e4 won
  backbone_lr_scale: 0.2     # was 0.05 — bblrs02 won
  llrd_factor: 0.8
  batch_size: 8
  grad_accum_steps: 8
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 3
  min_lr: 1.0e-7
  clip_grad_norm: 1.0

  # All augmentation OFF (aug_off won)
  use_random_resized_crop: false
  use_augment: false
  color_prob: 0.0
  color_strength: 0.0
  blur_prob: 0.0
  flip_prob: 0.0
  use_temporal_map: false
  equivariant_reverse_prob: 0.0
  use_mixup: false
  mixup_alpha: 0.0
