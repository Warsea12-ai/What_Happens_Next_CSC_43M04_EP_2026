# @package _global_
# VideoMAEPairAttn: SSv2-Base + All-Pairs Temporal Comparison + LoRA rank=16.
# Key innovation: all C(4,2)=6 pairwise frame differences (vs 3 in TemporalHead).
# Temporal self-attention on 4 original frames (not 8 interpolated groups).
# Classification from [CLS + 6 deltas] = 7x768 -> head.
defaults:
  - override /model: videomae_pair_attn

model:
  backbone: "MCG-NJU/videomae-base-finetuned-ssv2"
  num_frozen_blocks: 6
  n_temporal_layers: 3
  n_heads: 8
  dropout: 0.3
  head_hidden: 1024
  lora_rank: 16
  lora_alpha: 32.0

training:
  epochs: 80
  lr: 2.0e-4
  backbone_lr_scale: 0.05
  batch_size: 16
  grad_accum_steps: 4
  weight_decay: 2.0e-4
  label_smoothing: 0.1
  warmup_epochs: 8
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.8
  color_strength: 0.3
  blur_prob: 0.1
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.6
  use_mixup: true
  mixup_alpha: 0.3
