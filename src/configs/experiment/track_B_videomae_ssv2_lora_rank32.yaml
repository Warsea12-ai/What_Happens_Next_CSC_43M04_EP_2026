# @package _global_
# SSv2 Base + LoRA rank=32 (progression rank=8 → 16 → 32).
# Plus de capacité d'adaptation LoRA : ~6M params LoRA vs ~3M pour rank=16.
# Hypothèse : SSv2 in-domain + haute capacité LoRA = meilleure adaptation tête.
defaults:
  - override /model: videomae_lora

model:
  backbone: "MCG-NJU/videomae-base-finetuned-ssv2"
  lora_rank: 32
  lora_alpha: 64.0
  dropout: 0.3
  head_hidden: 768

training:
  epochs: 70
  lr: 2.0e-4
  backbone_lr_scale: 0.05
  batch_size: 16
  grad_accum_steps: 4
  weight_decay: 2.0e-4
  label_smoothing: 0.1
  warmup_epochs: 8
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.8
  color_strength: 0.3
  blur_prob: 0.1
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.6
  use_mixup: true
  mixup_alpha: 0.3
