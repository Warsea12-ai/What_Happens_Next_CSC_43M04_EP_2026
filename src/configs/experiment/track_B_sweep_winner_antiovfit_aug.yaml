# @package _global_
# Winner triple + augmentations re-enabled (le best_combo aug_off était
# optimisé sur split train, mais sur val_dir held-out l'aug réduit l'overfit).
# Color + blur + flip + RRC mild — tout sauf mixup pour isoler l'effet.
defaults:
  - override /model: videomae_cross_attn_pairs

model:
  backbone: "MCG-NJU/videomae-base-finetuned-ssv2"
  num_frozen_blocks: 0
  n_temporal_layers: 2
  n_heads: 8
  dropout: 0.25
  head_hidden: 2048
  interp_mode: "centered"

training:
  epochs: 20
  optimizer: prodigy
  lr: 1.0
  backbone_lr_scale: 0.5
  llrd_factor: 0.8
  batch_size: 8
  grad_accum_steps: 4
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 3
  min_lr: 1.0e-7
  clip_grad_norm: 1.0
  use_ema: true
  ema_decay: 0.999

  # AUGMENTATIONS RE-ENABLED
  use_random_resized_crop: true
  rrc_scale_min: 0.7        # mild crop 70-100%
  rrc_scale_max: 1.0
  use_augment: true
  color_prob: 0.5
  color_strength: 0.2
  blur_prob: 0.1
  flip_prob: 0.5
  use_temporal_map: false
  equivariant_reverse_prob: 0.0
  use_mixup: false
  mixup_alpha: 0.0
