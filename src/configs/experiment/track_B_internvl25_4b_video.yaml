# @package _global_
# InternVL25_4BVideo — InternVL2.5-4B (OpenGVLab, Dec 2024) as VLM classifier.
#
# Bigger (4B total) and more recent than V-JEPA 2. Tested fit on RTX A4000 16GB
# (140W bucket): ~10-12 GB peak with batch=1 + grad_accum=16 + 4 frames @ 448².
#
# Key architectural novelty vs existing arsenal:
#   - InternViT-300M-448px-V2_5 high-res vision tower (vs V-JEPA's 224px)
#   - Pixel-shuffle 4× token compression (256 vision tokens per 448² frame)
#   - Combines two strong foundation models: InternViT + Qwen2.5-3B-Instruct
defaults:
  - override /model: internvl25_4b_video

model:
  lora_rank: 16
  lora_alpha: 32.0
  head_hidden: 2048
  dropout: 0.3
  pixel_shuffle_scale: 0.5  # 4× token compression (256 tokens per frame)

training:
  epochs: 25
  lr: 1.0e-4
  backbone_lr_scale: 0.0
  llrd_factor: 1.0
  batch_size: 1
  grad_accum_steps: 16
  weight_decay: 0.05
  label_smoothing: 0.1
  warmup_epochs: 3
  min_lr: 1.0e-6
  clip_grad_norm: 1.0
  wandb_watch: false      # disable wandb.watch grad hook (saves ~500MB on big LLMs)

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.8
  color_strength: 0.35
  blur_prob: 0.1
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.6
  use_mixup: true
  mixup_alpha: 0.4
