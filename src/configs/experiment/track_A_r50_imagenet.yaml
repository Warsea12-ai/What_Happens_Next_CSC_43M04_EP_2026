# @package _global_
# Track A — R50 + ImageNet pretrained + motion head + 8 frames.
#
# Middle ground between R18 speed and R152 capacity.
# R50 with IMAGENET1K_V2 weights is the sweet spot for fine-tuning:
# strong features, manageable memory, fits batch=32 on a single GPU.
defaults:
  - override /model: TSM_s

dataset:
  num_frames: 8

model:
  pretrained: true
  n_resnet_layers: 50
  fold_div: 8
  dropout: 0.4
  temporal_pool: motion
  use_frame_diff: true
  use_positional_encoding: true
  pe_mode: sinusoidal
  stochastic_depth: 0.2
  head_hidden: false

training:
  epochs: 80
  lr: 1.5e-4
  batch_size: 32
  weight_decay: 3.0e-4
  label_smoothing: 0.1
  warmup_epochs: 5
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true

  use_augment: true
  color_prob: 0.5
  color_strength: 0.15
  blur_prob: 0.0

  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5

  use_mixup: true
  mixup_alpha: 0.4
  use_cutmix: true
  cutmix_alpha: 0.5
