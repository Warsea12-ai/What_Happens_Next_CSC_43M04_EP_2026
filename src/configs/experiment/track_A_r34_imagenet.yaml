# @package _global_
# Track A — R34 + ImageNet pretrained + motion head + 8 frames.
#
# R34 uses BasicBlocks (like R18) but with 3 stages of 4 blocks vs R18's 2.
# Deeper than R18 (34 vs 18 layers) but same output dim (512-D).
# Fills the gap in our backbone sweep: R18(0.3766) → R34 → R50 → R152(0.4036).
# All from scratch. With ImageNet init this should push significantly above R18.
defaults:
  - override /model: TSM_s

dataset:
  num_frames: 8

model:
  pretrained: false
  n_resnet_layers: 34
  fold_div: 8
  dropout: 0.35
  temporal_pool: motion
  use_frame_diff: true
  use_positional_encoding: true
  pe_mode: sinusoidal
  stochastic_depth: 0.12
  head_hidden: false

training:
  epochs: 80
  lr: 2.0e-4
  batch_size: 64
  weight_decay: 2.0e-4
  label_smoothing: 0.1
  warmup_epochs: 5
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.5
  color_strength: 0.15
  blur_prob: 0.0
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5
  use_mixup: true
  mixup_alpha: 0.4
  use_cutmix: true
  cutmix_alpha: 0.5
