# @package _global_
# VideoMAE-Base SSv2 + interp_centered + EMA + aug-off (winner recipe).
# Variante de track_B_videomae_v2 qui adopte exactement les options gagnantes
# (cf. winner_triple_ema_997 : val_dir 0.59 sur eval réel).
defaults:
  - override /model: videomae
model:
  num_frozen_blocks: 4
  dropout: 0.2
  frames_repeat: 4
  interp_mode: "centered"
training:
  epochs: 20
  optimizer: prodigy
  lr: 1.0
  backbone_lr_scale: 0.5
  llrd_factor: 0.85
  batch_size: 8
  grad_accum_steps: 4
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 3
  min_lr: 1.0e-7
  clip_grad_norm: 1.0

  use_ema: true
  ema_decay: 0.999

  use_random_resized_crop: false
  use_augment: false
  color_prob: 0.0
  color_strength: 0.0
  blur_prob: 0.0
  flip_prob: 0.0
  use_temporal_map: false
  equivariant_reverse_prob: 0.0
  use_mixup: false
  mixup_alpha: 0.0
