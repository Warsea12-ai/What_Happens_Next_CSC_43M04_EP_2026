# @package _global_
# V-JEPA 2 ViT-G + best_combo learnings via LoRA on ALL 40 blocks.
# Uses vjepa2_variants (variant="lora") which applies LoRA adapters across
# the entire encoder — equivalent to "frozen0 with bounded memory" since
# LoRA only stores ~180M trainable params instead of full backbone gradients.
defaults:
  - override /model: vjepa2_variants

model:
  backbone: "facebook/vjepa2-vitg-fpc64-384-ssv2"
  variant: "lora"
  num_frozen_blocks: 32       # ignored in lora mode (all blocks have adapters)
  lora_rank: 16
  lora_alpha: 32.0
  dropout: 0.25
  head_hidden: 2048

training:
  epochs: 25
  lr: 3.0e-4
  backbone_lr_scale: 0.2
  llrd_factor: 0.0            # not used in lora mode
  batch_size: 4
  grad_accum_steps: 16
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 3
  min_lr: 1.0e-7
  clip_grad_norm: 1.0
  wandb_watch: false

  use_random_resized_crop: false
  use_augment: false
  color_prob: 0.0
  color_strength: 0.0
  blur_prob: 0.0
  flip_prob: 0.0
  use_temporal_map: false
  equivariant_reverse_prob: 0.0
  use_mixup: false
  mixup_alpha: 0.0
