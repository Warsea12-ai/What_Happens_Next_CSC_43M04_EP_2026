# @package _global_
# MViT-V2 advanced combo: cw_valaware + mixup_0.2 + dropout=0.15 + interp_repeat + EMA.
# Test 3-axis stack des meilleurs régularisateurs sur MViT (sans ls_02 ni aug).
defaults:
  - override /model: mvit_v2_ssv2
model:
  backbone: "facebook/mvit-base-finetuned-ssv2"
  num_frozen_blocks: 0
  dropout: 0.15
  head_hidden: 1024
  interp_mode: "repeat"
training:
  epochs: 15
  optimizer: prodigy
  lr: 1.0
  backbone_lr_scale: 0.5
  llrd_factor: 0.8
  batch_size: 4
  grad_accum_steps: 8
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 2
  min_lr: 1.0e-7
  clip_grad_norm: 1.0
  use_ema: true
  ema_decay: 0.999
  class_weights: "val_aware"
  use_random_resized_crop: false
  use_augment: false
  color_prob: 0.0
  color_strength: 0.0
  blur_prob: 0.0
  flip_prob: 0.0
  use_temporal_map: false
  equivariant_reverse_prob: 0.0
  use_mixup: true
  mixup_alpha: 0.2
