# @package _global_
# best_combo with mild RRC (scale=(0.9,1.0)) instead of aug_off.
# aug_off won big single-axis, but maybe a tiny bit of crop regularises
# without hurting the SSv2-pretrained backbone too much.
defaults:
  - override /model: videomae_cross_attn_pairs

model:
  backbone: "MCG-NJU/videomae-base-finetuned-ssv2"
  num_frozen_blocks: 0
  n_temporal_layers: 2
  n_heads: 8
  dropout: 0.25
  head_hidden: 2048

training:
  epochs: 20
  lr: 3.0e-4
  backbone_lr_scale: 0.2
  llrd_factor: 0.8
  batch_size: 8
  grad_accum_steps: 8
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 3
  min_lr: 1.0e-7
  clip_grad_norm: 1.0

  # Only mild RRC kept; everything else off (like best_combo).
  use_random_resized_crop: true
  rrc_scale_min: 0.9
  rrc_scale_max: 1.0
  use_augment: false
  color_prob: 0.0
  color_strength: 0.0
  blur_prob: 0.0
  flip_prob: 0.0
  use_temporal_map: false
  equivariant_reverse_prob: 0.0
  use_mixup: false
  mixup_alpha: 0.0
