# @package _global_
# Conservative combined-winners run — same as sweep_best_combo but keeps the
# augmentation ON (aug_off won single-axis, but other aug variants also did
# fine; we want to check whether aug_off is a real winner or whether it's
# masking the contribution of the other 4 changes). If best_combo > this,
# aug really hurts; if this >= best_combo, the gain is in the other 4.
defaults:
  - override /model: videomae_cross_attn_pairs

model:
  backbone: "MCG-NJU/videomae-base-finetuned-ssv2"
  num_frozen_blocks: 0
  n_temporal_layers: 2
  n_heads: 8
  dropout: 0.25
  head_hidden: 2048

training:
  epochs: 20
  lr: 3.0e-4
  backbone_lr_scale: 0.2
  llrd_factor: 0.8
  batch_size: 8
  grad_accum_steps: 8
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 3
  min_lr: 1.0e-7
  clip_grad_norm: 1.0

  # Default augmentation ON
  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.8
  color_strength: 0.35
  blur_prob: 0.1
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.6
  use_mixup: true
  mixup_alpha: 0.4
