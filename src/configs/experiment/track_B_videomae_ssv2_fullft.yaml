# @package _global_
# Track B — VideoMAE-Base SSv2, fully fine-tuned (no frozen blocks).
# Same-domain pretraining (SSv2 ≈ our challenge) → full fine-tune is safe.
# All 12 blocks trainable with low LLRD to protect early layers.
defaults:
  - override /model: videomae

model:
  num_frozen_blocks: 0     # unfreeze everything
  dropout: 0.3
  frames_repeat: 4

training:
  epochs: 50
  lr: 2.0e-4               # head LR
  backbone_lr_scale: 0.1   # backbone blocks: 2e-5 base
  llrd_factor: 0.75        # geometric decay per block toward input
  batch_size: 8
  grad_accum_steps: 4      # effective batch = 32
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 8
  min_lr: 1.0e-7
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.8
  color_strength: 0.3
  blur_prob: 0.1

  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5
  temporal_jitter: 1
