# @package _global_
# V-JEPA-G + interp_repeat + EMA. Test si V-JEPA-G profite aussi d'interp_repeat
# (qui a fait 0.7493 sur VideoMAE — proche de centered 0.7485). Pour ensembling,
# centered+repeat sont décorrélés (positionnement différent des tubelet temporels).
defaults:
  - override /model: vjepa2_head

model:
  backbone: "facebook/vjepa2-vitg-fpc64-384-ssv2"
  num_frozen_blocks: 24
  dropout: 0.25
  head_hidden: 2048
  interp_mode: "repeat"

training:
  epochs: 25
  lr: 3.0e-4
  backbone_lr_scale: 0.2
  llrd_factor: 0.80
  batch_size: 4
  grad_accum_steps: 16
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 3
  min_lr: 1.0e-7
  clip_grad_norm: 1.0
  wandb_watch: false

  use_ema: true
  ema_decay: 0.999

  use_random_resized_crop: false
  use_augment: false
  color_prob: 0.0
  color_strength: 0.0
  blur_prob: 0.0
  flip_prob: 0.0
  use_temporal_map: false
  equivariant_reverse_prob: 0.0
  use_mixup: false
  mixup_alpha: 0.0
