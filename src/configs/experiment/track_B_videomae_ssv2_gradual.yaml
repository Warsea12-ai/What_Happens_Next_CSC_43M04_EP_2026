# @package _global_
# VideoMAE-Base-SSv2 — dégel progressif + WD=0.05 + cosine
#
# Principe (architectures à 70%) :
#   - Départ : 10/12 blocs gelés (seulement les 2 derniers trainables)
#   - Epoch 15 : dégel à 7 (5 blocs trainables)
#   - Epoch 30 : dégel à 4 (8 blocs trainables)
#   - Epoch 45 : dégel à 2 (espagne final — 10 blocs trainables)
#   Chaque dégel reconstruit l'optimizer avec cosine restart.
#
# WD=0.05 : forte régularisation vs actuel 5e-4
defaults:
  - override /model: videomae

model:
  backbone: "MCG-NJU/videomae-base-finetuned-ssv2"
  num_frozen_blocks: 10
  dropout: 0.25

training:
  epochs: 80
  lr: 5.0e-5
  backbone_lr_scale: 0.1
  llrd_factor: 0.80
  batch_size: 8
  grad_accum_steps: 8
  weight_decay: 0.05
  label_smoothing: 0.1
  warmup_epochs: 10
  min_lr: 1.0e-7
  clip_grad_norm: 1.0

  # Progressive unfreezing: [epoch, n_frozen_blocks]
  unfreeze_schedule:
    - [15, 7]
    - [30, 4]
    - [45, 2]

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.8
  color_strength: 0.35
  blur_prob: 0.1
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.6
  use_mixup: true
  mixup_alpha: 0.4
