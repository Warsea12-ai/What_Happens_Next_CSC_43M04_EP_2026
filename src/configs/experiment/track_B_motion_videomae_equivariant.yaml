# @package _global_
# MotionVideoMAE (VideoMAE-Base SSv2) + strong equivariance.
# SSv2-pretrained backbone understands motion and object interactions well.
# The motion head uses delta = last−first, naturally aligned with the
# temporal reversal pairs. equivariant_reverse_prob=0.8 reinforces this.
defaults:
  - override /model: motion_videomae

model:
  num_frozen_blocks: 8
  dropout: 0.3

training:
  epochs: 50
  lr: 3.0e-4
  backbone_lr_scale: 0.067
  llrd_factor: 0.75
  batch_size: 16
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 8
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.8
  color_strength: 0.3
  blur_prob: 0.1
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.8
  use_mixup: true
  mixup_alpha: 0.4
