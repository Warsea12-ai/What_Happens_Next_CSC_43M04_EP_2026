# @package _global_
# VideoMAE V2 Giant SSv2-finetuned — variante FROZEN
# Backbone (1B params) entièrement gelé, seule la tête 33-classes est entraînée.
# Hypothèse : les features SSv2 sont déjà excellentes, suffisant pour adapter à 33 classes.
defaults:
  - override /model: videomaev2_giant

model:
  variant: "frozen"
  head_hidden: 1024
  dropout: 0.3

training:
  epochs: 25
  lr: 5.0e-4
  batch_size: 4
  grad_accum_steps: 16
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 3
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.6
  color_strength: 0.3
  blur_prob: 0.1
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.6
  use_mixup: true
  mixup_alpha: 0.3
