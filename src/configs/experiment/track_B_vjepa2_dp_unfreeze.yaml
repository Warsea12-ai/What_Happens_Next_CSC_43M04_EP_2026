# @package _global_
# V-JEPA 2 — pari plus agressif : 16 frozen (vs 24) + drop_path FORT (0.20) +
# dropout 0.35 + label_smoothing 0.12 + 20 epochs.
# Hypothèse : avec drop_path 0.2 et dropout fort, on peut débloquer plus de
# capacité (24 blocs trainables vs 16) sans surfit. Si ça tient → potentiel
# nettement > 72% car capacité d'apprentissage doublée.
defaults:
  - override /model: vjepa2_head

model:
  backbone: "facebook/vjepa2-vitg-fpc64-384-ssv2"
  num_frozen_blocks: 16
  dropout: 0.35
  head_hidden: 2048
  drop_path_rate: 0.20

training:
  epochs: 20
  lr: 1.0e-4
  backbone_lr_scale: 0.05
  llrd_factor: 0.85
  batch_size: 8
  grad_accum_steps: 8
  weight_decay: 0.01
  label_smoothing: 0.12
  warmup_epochs: 4
  min_lr: 1.0e-7
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.8
  color_strength: 0.35
  blur_prob: 0.1
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.6
  use_mixup: true
  mixup_alpha: 0.4
