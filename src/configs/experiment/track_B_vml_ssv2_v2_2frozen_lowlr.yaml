# @package _global_
# VideoMAE-Large-SSv2 v2 : 2 frozen + lr plus bas (3e-5)
# 3 archis SSv2-FT × 3 variantes — 20 epochs, 130W.
defaults:
  - override /model: videomae_large

model:
  backbone: "MCG-NJU/videomae-large-finetuned-ssv2"
  num_frozen_blocks: 2
  dropout: 0.25
  head_hidden: 2048

training:
  epochs: 20
  lr: 3.0e-5
  backbone_lr_scale: 0.05
  llrd_factor: 0.8
  batch_size: 4
  grad_accum_steps: 16
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 5
  min_lr: 1.0e-7
  clip_grad_norm: 1.0
  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.8
  color_strength: 0.35
  blur_prob: 0.1
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.6
  use_mixup: true
  mixup_alpha: 0.4
