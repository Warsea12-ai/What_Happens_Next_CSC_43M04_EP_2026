# @package _global_
# Track B — FramePairNet with Qwen2-VL-7B backbone.
# Cross-frame spatial attention with 3584-dim tokens (vs 1536 for 2B).
# head_hidden=1024 handles wider input (2×3584=7168 → 1024).
defaults:
  - override /model: frame_pair_net

model:
  backbone: Qwen/Qwen2-VL-7B-Instruct
  n_cross_layers: 2
  n_heads: 16              # head_dim = 3584/16 = 224
  dropout: 0.3
  head_hidden: 1024

training:
  epochs: 60
  lr: 3.0e-4
  backbone_lr_scale: 0.0
  batch_size: 4            # 2× encoder passes of 7B model — conservative
  grad_accum_steps: 16     # effective batch = 64
  weight_decay: 1.0e-3
  label_smoothing: 0.15
  warmup_epochs: 5
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.8
  color_strength: 0.4
  blur_prob: 0.15

  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5
  temporal_jitter: 1
