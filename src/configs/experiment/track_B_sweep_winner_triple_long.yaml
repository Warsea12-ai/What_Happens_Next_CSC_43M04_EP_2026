# @package _global_
# Winning triple sur 40 epochs (vs 20 par défaut). Sternum atteint 0.7591 à ep5/20
# et est encore en running — voir si plus d'epochs continuent de monter, ou
# le schedule cosine min_lr=1e-7 stabilise.
defaults:
  - override /model: videomae_cross_attn_pairs

model:
  backbone: "MCG-NJU/videomae-base-finetuned-ssv2"
  num_frozen_blocks: 0
  n_temporal_layers: 2
  n_heads: 8
  dropout: 0.25
  head_hidden: 2048
  interp_mode: "centered"

training:
  epochs: 40                  # was 20
  optimizer: prodigy
  lr: 1.0
  backbone_lr_scale: 0.5
  llrd_factor: 0.8
  batch_size: 8
  grad_accum_steps: 4
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 5            # warmup propotionnel
  min_lr: 1.0e-7
  clip_grad_norm: 1.0

  use_ema: true
  ema_decay: 0.999

  use_random_resized_crop: false
  use_augment: false
  color_prob: 0.0
  color_strength: 0.0
  blur_prob: 0.0
  flip_prob: 0.0
  use_temporal_map: false
  equivariant_reverse_prob: 0.0
  use_mixup: false
  mixup_alpha: 0.0
