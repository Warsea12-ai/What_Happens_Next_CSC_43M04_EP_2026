# @package _global_
# Track A — CNNBaseline avg pool (from scratch), improved training
# Baseline reference: same architecture as the 0.32 model but no pretrained weights.
# Longer training + cosine LR establishes what this architecture can actually do
# from scratch.
defaults:
  - override /model: cnn_baseline

model:
  pretrained: false
  pool: avg

training:
  epochs: 60
  lr: 3.0e-4
  batch_size: 64
  weight_decay: 1e-4
  label_smoothing: 0.1
  warmup_epochs: 5
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true
