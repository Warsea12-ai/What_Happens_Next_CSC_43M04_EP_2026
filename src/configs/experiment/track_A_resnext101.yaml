# @package _global_
# Track A — ResNeXt-101-32x8d from scratch + 8 frames + motion head.
#
# ResNeXt-101-32x8d: 32 groups × 8 channels per group = 256 total grouped
# channels per Bottleneck. Deeper AND wider than ResNeXt-50.
# This is the standard "large" ResNeXt used in video understanding work
# (SlowFast, etc.) when training from scratch at moderate dataset scales.
#
# batch_size=16: slightly larger model than R101 standard due to grouped conv.
defaults:
  - override /model: TSM_s

dataset:
  num_frames: 8

model:
  pretrained: false
  n_resnet_layers: 101
  backbone_variant: resnext
  fold_div: 8
  dropout: 0.5
  temporal_pool: motion
  use_frame_diff: true
  use_positional_encoding: true
  pe_mode: sinusoidal
  stochastic_depth: 0.28
  head_hidden: false

training:
  epochs: 120
  lr: 5.0e-4
  batch_size: 16
  weight_decay: 4.0e-4
  label_smoothing: 0.12
  warmup_epochs: 8
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.5
  color_strength: 0.15
  blur_prob: 0.0
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5
  use_mixup: true
  mixup_alpha: 0.6
