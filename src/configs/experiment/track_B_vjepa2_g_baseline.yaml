# @package _global_
# V-JEPA 2 ViT-G + best_combo learnings adapted.
# Reference (videomae_cross_attn_pairs): best_combo = aug_off + frozen0 +
# bblrs02 + lr_3e4 + head2048 stacked → 0.728 val_acc.
#
# Adaptation for V-JEPA 2 ViT-G:
#   - frozen0 not feasible (1B params + grad blows 20GB) → frozen=24
#     (16 trainable blocks, the most we can fit on 130W with batch=4)
#   - bblrs02, lr_3e4, head_hidden=2048, aug_off applied verbatim
defaults:
  - override /model: vjepa2_head

model:
  backbone: "facebook/vjepa2-vitg-fpc64-384-ssv2"
  num_frozen_blocks: 24       # was 32 default — unfreeze more (16 trainable blocks)
  dropout: 0.25
  head_hidden: 2048

training:
  epochs: 25
  lr: 3.0e-4                  # was 1e-4 — best_combo
  backbone_lr_scale: 0.2      # was 0.05 — best_combo
  llrd_factor: 0.80
  batch_size: 4
  grad_accum_steps: 16        # effective batch = 64
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 3            # was 10 — wandb correlation says less warmup wins
  min_lr: 1.0e-7
  clip_grad_norm: 1.0
  wandb_watch: false

  # aug_off (best_combo winner)
  use_random_resized_crop: false
  use_augment: false
  color_prob: 0.0
  color_strength: 0.0
  blur_prob: 0.0
  flip_prob: 0.0
  use_temporal_map: false
  equivariant_reverse_prob: 0.0
  use_mixup: false
  mixup_alpha: 0.0
