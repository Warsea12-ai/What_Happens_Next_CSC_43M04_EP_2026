# @package _global_
# V-JEPA-G baseline + grad_accum réduit (16→8), donc eff_batch 64→32.
# Transfère le levier "grad_accum_4" qui a donné +0.30pp sur VideoMAE
# (best_combo_v2 → grad_accum_4 = 0.7382 → 0.7412).
# Hypothèse : plus d'updates par epoch = meilleure convergence early.
defaults:
  - override /model: vjepa2_head

model:
  backbone: "facebook/vjepa2-vitg-fpc64-384-ssv2"
  num_frozen_blocks: 24
  dropout: 0.25
  head_hidden: 2048

training:
  epochs: 25
  lr: 3.0e-4
  backbone_lr_scale: 0.2
  llrd_factor: 0.80
  batch_size: 4
  grad_accum_steps: 8         # was 16 → eff_batch 32
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 3
  min_lr: 1.0e-7
  clip_grad_norm: 1.0
  wandb_watch: false
  use_random_resized_crop: false
  use_augment: false
  color_prob: 0.0
  color_strength: 0.0
  blur_prob: 0.0
  flip_prob: 0.0
  use_temporal_map: false
  equivariant_reverse_prob: 0.0
  use_mixup: false
  mixup_alpha: 0.0
