# @package _global_
# Track A — R152 + fold_div=4 + multi-scale + 8 frames.
#
# Tests whether stronger temporal shift (fold_div=4) and richer spatial features
# (multiscale 3584-D) compound. The hypothesis:
#   fold_div=4 → more channels carry temporal information
#   multiscale  → each of layer2/3/4 already has 25% shifted channels
# Together: temporal information propagates through more channels AND across
# more semantic scales simultaneously.
#
# motion_head_hidden=1024: the 4×3584=14336-D input to the motion head needs
# a larger bottleneck than the default 512 to preserve information.
defaults:
  - override /model: TSM_s

dataset:
  num_frames: 8

model:
  pretrained: false
  n_resnet_layers: 152
  fold_div: 4
  dropout: 0.5
  temporal_pool: motion
  use_frame_diff: true
  use_positional_encoding: true
  pe_mode: sinusoidal
  stochastic_depth: 0.35
  head_hidden: false
  use_multiscale: true
  motion_head_hidden: 1024

training:
  epochs: 120
  lr: 5.0e-4
  batch_size: 8
  gradient_accumulation_steps: 2
  weight_decay: 5.0e-4
  label_smoothing: 0.15
  warmup_epochs: 8
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.5
  color_strength: 0.15
  blur_prob: 0.0
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5
  use_mixup: true
  mixup_alpha: 0.8
  use_cutmix: true
  cutmix_alpha: 1.0
