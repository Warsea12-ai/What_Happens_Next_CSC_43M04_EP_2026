# @package _global_
# Track A — R152 + larger motion head (1024 hidden) + 8 frames.
#
# The default motion head compresses 4×2048=8192-D → 512 → 33.
# That 512 bottleneck discards 94% of the feature information in one step.
# A larger bottleneck (1024) gives the head more capacity to disentangle
# the 33 action classes from the high-dimensional motion features.
#
# This is the cheapest possible architectural change — same backbone, same
# temporal pooling, just a wider hidden layer in the classification head.
# ~4M extra params (2048×1024 vs 2048×512).
defaults:
  - override /model: TSM_s

dataset:
  num_frames: 8

model:
  pretrained: false
  n_resnet_layers: 152
  fold_div: 8
  dropout: 0.5
  temporal_pool: motion
  use_frame_diff: true
  use_positional_encoding: true
  pe_mode: sinusoidal
  stochastic_depth: 0.35
  head_hidden: false
  motion_head_hidden: 1024

training:
  epochs: 120
  lr: 5.0e-4
  batch_size: 16
  weight_decay: 5.0e-4
  label_smoothing: 0.15
  warmup_epochs: 8
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.5
  color_strength: 0.15
  blur_prob: 0.0
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5
  use_mixup: true
  mixup_alpha: 0.8
  use_cutmix: true
  cutmix_alpha: 1.0
