# @package _global_
# Track A — TSM-R152 + motion head + 8-frame sampling + full augmentation.
# The previous best (0.4036) used 8 frames with minimal augmentation.
# This adds: motion head, frame_diff, MixUp, RRC, equivariant reverse.
# Hypothesis: 8 frames × new recipe > old 8-frame recipe (0.4036).
defaults:
  - override /model: TSM_s

dataset:
  num_frames: 8            # 8-frame sampling (same as old best)

model:
  pretrained: false
  n_resnet_layers: 152
  fold_div: 8
  dropout: 0.5
  temporal_pool: motion
  use_frame_diff: true
  use_positional_encoding: true
  pe_mode: sinusoidal
  stochastic_depth: 0.35
  head_hidden: false

training:
  epochs: 120
  lr: 5.0e-4
  batch_size: 16
  weight_decay: 5.0e-4
  label_smoothing: 0.15
  warmup_epochs: 8
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.5
  color_strength: 0.15
  blur_prob: 0.0

  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5

  use_mixup: true
  mixup_alpha: 0.8
