# @package _global_
# Phase 2 sweep : aug_full. Active toute la pipeline d'augmentations
# (random_resized_crop + flip + temporal_map + color jitter + blur + mixup).
# Hypothèse : early-stop à epoch 13 sur baseline = overfitting potentiel,
# augmentations devraient prolonger la phase d'apprentissage et améliorer la généralisation.
defaults:
  - override /model: dinov3_pairs
model:
  backbone: "facebook/dinov3-vith16plus-pretrain-lvd1689m"
  backbone_dtype: "bfloat16"
  n_temporal_layers: 2
  n_heads: 8
  dropout: 0.25
  head_hidden: 2048
training:
  epochs: 30
  optimizer: prodigy
  lr: 1.0
  backbone_lr_scale: 0.0
  llrd_factor: 0.0
  batch_size: 4
  grad_accum_steps: 16
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 3
  min_lr: 1.0e-7
  clip_grad_norm: 1.0
  # ← TOUT activé (vs baseline tout off)
  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.8
  color_strength: 0.30
  blur_prob: 0.1
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.6
  use_mixup: true
  mixup_alpha: 0.4
  early_stop_patience: 8
  num_workers: 2
