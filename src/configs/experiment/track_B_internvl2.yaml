# @package _global_
# InternVL2-8B — SigLIP-SO400M + InternLM2-7.7B (LoRA) + 33-class head
#
# Pourquoi InternVL2 plutôt que Qwen2-VL :
#   - SigLIP (vs CLIP) : pré-entraîné sur 4 B paires image-texte avec contrastive loss sigmoïde
#     → features spatiales bien plus riches pour la reconnaissance d'actions
#   - LLM (InternLM2-7.7B) en mode encodeur (pas de génération de texte) :
#     la tête de classification reçoit les hidden states directement
#   - Multi-image natif : les 4 frames sont vues en un seul forward pass
#     → le LLM peut comparer les frames directement (attention croisée inter-frames)
#
# Stratégie mémoire sur RTX A5000 (24 GB) :
#   - Modèle bfloat16 : ~16 GB
#   - LoRA rank 16 sur q/k/v/o des 8 derniers blocs LLM : ~0.3 GB
#   - Activations batch=1 : ~4 GB
#   - batch=1 grad_accum=64 → batch effectif 64
#
# WD=0.05 (même recette que les architectures à 70%)
defaults:
  - override /model: internvl2_classifier

model:
  backbone: "OpenGVLab/InternVL2-8B"
  lora_rank: 16
  lora_alpha: 32.0
  dropout: 0.25
  num_frozen_llm_layers: 24

training:
  epochs: 60
  lr: 5.0e-5
  backbone_lr_scale: 0.1
  llrd_factor: 0.0
  batch_size: 1
  grad_accum_steps: 64
  weight_decay: 0.05
  label_smoothing: 0.1
  warmup_epochs: 8
  min_lr: 1.0e-7
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.8
  color_strength: 0.3
  blur_prob: 0.05
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.6
  use_mixup: false
