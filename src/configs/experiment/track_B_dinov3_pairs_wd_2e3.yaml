# @package _global_
# Phase 3 — pousse l'axe wd (winner Phase 2 = wd=1e-3 à 59.24%).
# Hypothèse : si wd 5e-4 → 1e-3 a donné +0.18 pp, wd=2e-3 peut donner +0.3 pp.
defaults:
  - override /model: dinov3_pairs
model:
  backbone: "facebook/dinov3-vith16plus-pretrain-lvd1689m"
  backbone_dtype: "bfloat16"
  n_temporal_layers: 2
  n_heads: 8
  dropout: 0.25
  head_hidden: 2048
training:
  epochs: 30
  optimizer: prodigy
  lr: 1.0
  backbone_lr_scale: 0.0
  llrd_factor: 0.0
  batch_size: 4
  grad_accum_steps: 16
  weight_decay: 2.0e-3        # ← varié (baseline=5e-4, Phase 2 winner=1e-3)
  label_smoothing: 0.1
  warmup_epochs: 3
  min_lr: 1.0e-7
  clip_grad_norm: 1.0
  use_random_resized_crop: false
  use_augment: false
  color_prob: 0.0
  color_strength: 0.0
  blur_prob: 0.0
  flip_prob: 0.0
  use_temporal_map: false
  equivariant_reverse_prob: 0.0
  use_mixup: false
  mixup_alpha: 0.0
  early_stop_patience: 8
  num_workers: 2
