# @package _global_
# Track A — CNNTemporal: ResNet34 + explicit temporal direction encoding
# No temporal shift ops → stable from-scratch training
# Direction signal: avg(first half) | avg(second half) | difference
defaults:
  - override /model: cnn_temporal

model:
  backbone: resnet18
  dropout: 0.5
  head_dim: 256

training:
  epochs: 80
  lr: 5.0e-4             # was 1e-3; lower LR needed given small gradient signal from direction
  batch_size: 64
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 8
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true

  use_augment: true
  color_prob: 0.5
  color_strength: 0.15   # mild; from-scratch backbone needs stable gradients early
  blur_prob: 0.0
  motion_blur_prob: 0.0
  pixelation_prob: 0.0

  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5

  use_mixup: true
  mixup_alpha: 0.8
  use_cutmix: true
  cutmix_alpha: 1.0
