# @package _global_
# Track A — CNNTemporal: ResNet34 + explicit temporal direction encoding
# No temporal shift ops → stable from-scratch training
# Direction signal: avg(first half) | avg(second half) | difference
defaults:
  - override /model: cnn_temporal

model:
  backbone: resnet34
  dropout: 0.5
  head_dim: 512

training:
  epochs: 50
  lr: 0.001
  batch_size: 64
  weight_decay: 1e-4
  label_smoothing: 0.1
  warmup_epochs: 5
  min_lr: 1.0e-5
  clip_grad_norm: 1.0

  use_random_resized_crop: true

  use_augment: true
  color_prob: 0.8
  color_strength: 0.3
  blur_prob: 0.1
  motion_blur_prob: 0.1
  pixelation_prob: 0.1

  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5
