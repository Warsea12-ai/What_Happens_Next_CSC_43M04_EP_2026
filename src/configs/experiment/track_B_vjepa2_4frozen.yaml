# @package _global_
# V-JEPA 2 — 4/40 blocs gelés (10% gelé, très agressif)
# WD=0.05 pour compenser le risque d'overfitting avec autant de backbone trainable.
defaults:
  - override /model: vjepa2_head
model:
  backbone: "facebook/vjepa2-vitg-fpc64-384-ssv2"
  num_frozen_blocks: 4
  dropout: 0.3
  head_hidden: 2048
training:
  epochs: 20
  lr: 5.0e-5
  backbone_lr_scale: 0.05
  llrd_factor: 0.80
  batch_size: 4
  grad_accum_steps: 16
  weight_decay: 0.05
  label_smoothing: 0.1
  warmup_epochs: 4
  min_lr: 1.0e-7
  clip_grad_norm: 1.0
  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.8
  color_strength: 0.35
  blur_prob: 0.1
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.6
  use_mixup: true
  mixup_alpha: 0.4
