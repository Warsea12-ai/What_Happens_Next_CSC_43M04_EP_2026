# @package _global_
# Counter-test to aug_motion_only: keep ONLY appearance augmentations,
# turn OFF motion-related ones. Together with aug_motion_only and aug_off,
# this triangulates which augmentation category hurts.
#   KEEP:  color jitter, gaussian blur, RandomResizedCrop
#   OFF:   flip, temporal-reverse equivariance, mixup
defaults:
  - override /model: videomae_cross_attn_pairs

model:
  backbone: "MCG-NJU/videomae-base-finetuned-ssv2"
  num_frozen_blocks: 2
  n_temporal_layers: 2
  n_heads: 8
  dropout: 0.25
  head_hidden: 1024

training:
  epochs: 20
  lr: 1.0e-4
  backbone_lr_scale: 0.05
  llrd_factor: 0.8
  batch_size: 8
  grad_accum_steps: 8
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 3
  min_lr: 1.0e-7
  clip_grad_norm: 1.0

  # APPEARANCE AUGS KEPT
  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.8
  color_strength: 0.35
  blur_prob: 0.1

  # MOTION AUGS OFF
  flip_prob: 0.0
  use_temporal_map: false
  equivariant_reverse_prob: 0.0
  use_mixup: false
  mixup_alpha: 0.0
