# @package _global_
# V-JEPA 2 ViT-L (300M, 24 blocks) + best_combo learnings.
# Baseline (vjepa2_vitl_dup): num_frozen=0 (already full unfreeze), lr=1e-4,
# bblrs=0.03, head_hidden=512. Apply best_combo: aug_off + bigger head + lr_3e4
# + bblrs bumped to 0.2.
defaults:
  - override /model: vjepa2_vitl_dup

model:
  backbone: "facebook/vjepa2-vitl-fpc16-256-ssv2"
  num_frozen_blocks: 0        # already best — fully unfrozen
  crop_size: 256
  dropout: 0.1
  head_hidden: 2048           # was 512 — best_combo head bump
  pool_heads: 8

training:
  epochs: 30
  lr: 3.0e-4                  # was 1e-4 — best_combo
  backbone_lr_scale: 0.2      # was 0.03 — much more generous (best_combo)
  llrd_factor: 1.0
  batch_size: 4
  grad_accum_steps: 16
  optimizer: adamw
  weight_decay: 0.05
  label_smoothing: 0.1
  warmup_epochs: 3
  min_lr: 1.0e-7
  clip_grad_norm: 1.0
  wandb_watch: false

  # aug_off
  use_random_resized_crop: false
  use_augment: false
  color_prob: 0.0
  color_strength: 0.0
  blur_prob: 0.0
  flip_prob: 0.0
  use_temporal_map: false
  equivariant_reverse_prob: 0.0
  use_mixup: false
  mixup_alpha: 0.0
