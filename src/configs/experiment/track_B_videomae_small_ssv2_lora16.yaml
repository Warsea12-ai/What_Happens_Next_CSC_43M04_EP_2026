# @package _global_
# VideoMAE-Small SSv2 — LoRA rank 16 (capacité élevée par rapport au backbone 22M).
defaults:
  - override /model: videomae_lora

model:
  backbone: "MCG-NJU/videomae-small-finetuned-ssv2"
  lora_rank: 16
  lora_alpha: 32.0
  dropout: 0.3
  head_hidden: 512

training:
  epochs: 40
  lr: 2.0e-4
  backbone_lr_scale: 0.1
  batch_size: 16
  grad_accum_steps: 4
  weight_decay: 2.0e-4
  label_smoothing: 0.1
  warmup_epochs: 5
  min_lr: 1.0e-6
  clip_grad_norm: 1.0
  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.6
  color_strength: 0.3
  blur_prob: 0.1
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.6
  use_mixup: true
  mixup_alpha: 0.3
