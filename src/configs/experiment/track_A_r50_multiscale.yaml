# @package _global_
# Track A — R50 from scratch + multi-scale feature fusion + 8 frames.
#
# Currently all TSM_s models use only the final layer4 output (2048-dim for R50).
# Multi-scale fuses: layer2(512) + layer3(1024) + layer4(2048) = 3584-dim.
#
# What each scale contributes:
#   layer2 (512-D, 28×28 spatial): fine-grained textures, edges, small motions
#   layer3 (1024-D, 14×14):       mid-level parts, object segments
#   layer4 (2048-D, 7×7):         high-level semantics, action context
#
# All three are average-pooled independently then concatenated before the
# temporal pooling step. This is like FPN-lite for temporal action recognition.
#
# R50 chosen here: 3584-dim is large but R50 is lighter than R152 — allows
# batch_size=16 with the bigger feature vector.
defaults:
  - override /model: TSM_s

dataset:
  num_frames: 8

model:
  pretrained: false
  n_resnet_layers: 50
  fold_div: 8
  dropout: 0.45
  temporal_pool: motion
  use_frame_diff: true
  use_positional_encoding: true
  pe_mode: sinusoidal
  stochastic_depth: 0.20
  head_hidden: false
  use_multiscale: true

training:
  epochs: 120
  lr: 5.0e-4
  batch_size: 16
  weight_decay: 3.0e-4
  label_smoothing: 0.1
  warmup_epochs: 8
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.5
  color_strength: 0.15
  blur_prob: 0.0
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5
  use_mixup: true
  mixup_alpha: 0.6
  use_cutmix: true
  cutmix_alpha: 0.8
