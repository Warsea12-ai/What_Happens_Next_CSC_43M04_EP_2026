# @package _global_
# Track A — TSM_s + multi-task SSL backbone + motion head.
# Backbone pretrained with BOTH temporal order AND temporal position tasks.
#
# Pretrain:
#   python pretrain_ssl_trackA.py --arch resnet18 --use_tsm --multi_task \
#       --epochs 30 --out ssl_tsm_multi_backbone.pt
defaults:
  - override /model: TSM_s

model:
  n_resnet_layers: 18
  fold_div: 8
  dropout: 0.35
  temporal_pool: motion
  use_frame_diff: false
  use_positional_encoding: true
  pe_mode: sinusoidal
  stochastic_depth: 0.10
  head_hidden: false
  pretrained_backbone_path: ssl_tsm_multi_backbone.pt

training:
  epochs: 80
  lr: 3.0e-4
  batch_size: 64
  weight_decay: 2.0e-4
  label_smoothing: 0.1
  warmup_epochs: 5
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true

  use_augment: true
  color_prob: 0.5
  color_strength: 0.15
  blur_prob: 0.0

  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5

  use_mixup: true
  mixup_alpha: 0.3
