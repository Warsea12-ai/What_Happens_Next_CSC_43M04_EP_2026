# @package _global_
# Variante du config champion (videomae_ssv2_cross_attn_pairs, 46.39% top-1) avec
# interpolation temporelle CENTRÉE au lieu de l'aligned par défaut.
#
# Ce qui change vs. le baseline :
#   interp_mode = "centered"
#     → les 4 frames d'entrée sont placées au CENTRE de leurs 4 segments
#       (positions [1.5, 5.5, 9.5, 13.5] au lieu de [0, 5, 10, 15]).
#     → toutes les 16 positions de sortie sont des blends linéaires symétriques.
#     → aucune frame d'entrée n'est privilégiée comme "identité aux bords".
#
# Reste identique à track_B_videomae_ssv2_cross_attn_pairs.yaml — A/B propre.
defaults:
  - override /model: videomae_cross_attn_pairs

model:
  backbone: "MCG-NJU/videomae-base-finetuned-ssv2"
  num_frozen_blocks: 2
  n_temporal_layers: 2
  n_heads: 8
  dropout: 0.25
  head_hidden: 1024
  interp_mode: "centered"   # ← seul changement

training:
  epochs: 80
  lr: 1.0e-4
  backbone_lr_scale: 0.05
  llrd_factor: 0.80
  batch_size: 8
  grad_accum_steps: 8
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 10
  min_lr: 1.0e-7
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.8
  color_strength: 0.35
  blur_prob: 0.1
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.6
  use_mixup: true
  mixup_alpha: 0.4
