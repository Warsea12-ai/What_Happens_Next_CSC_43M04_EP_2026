# @package _global_
# Track A — CNNBaseline first+last pooling (from scratch)
# Instead of averaging all T frames, the head sees:
#   [LayerNorm(first_frame), LayerNorm(last_frame), LayerNorm(last - first)]
# The third component is an explicit direction signal — critical for
# Something-Something where "moving left" != "moving right".
defaults:
  - override /model: cnn_baseline

model:
  pretrained: false
  pool: firstlast

training:
  epochs: 60
  lr: 3.0e-4
  batch_size: 64
  weight_decay: 1e-4
  label_smoothing: 0.1
  warmup_epochs: 5
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true
