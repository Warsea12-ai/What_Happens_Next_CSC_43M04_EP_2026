# @package _global_
# VideoMAE-Large fine-tuné sur SSv2 + LoRA rank=16.
# Combine la grande capacité du Large (307M) avec le backbone SSv2 in-domain.
# videomae_lora default = Large-Kinetics. Ce variant pousse vers Large-SSv2.
# Hypothèse : plus grande capacité + in-domain backbone = meilleure frontière.
defaults:
  - override /model: videomae_lora

model:
  backbone: "MCG-NJU/videomae-large-finetuned-ssv2"
  lora_rank: 16
  lora_alpha: 32.0
  dropout: 0.3
  head_hidden: 1024

training:
  epochs: 60
  lr: 1.5e-4
  backbone_lr_scale: 0.05
  batch_size: 8
  grad_accum_steps: 8
  weight_decay: 2.0e-4
  label_smoothing: 0.1
  warmup_epochs: 8
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.8
  color_strength: 0.3
  blur_prob: 0.1
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.6
  use_mixup: true
  mixup_alpha: 0.3
