# @package _global_
# Push temporal resolution further: 16 frames is the native VideoMAE pretraining
# window. Activation memory grows ~linearly with num_frames; with batch=2 and
# grad_accum=32 we stay in 20GB. Higher cost per epoch (~3-4× slower than 4 frames)
# but if the signal is strong this is worth it for the paper.
defaults:
  - override /model: videomae_cross_attn_pairs

model:
  backbone: "MCG-NJU/videomae-base-finetuned-ssv2"
  num_frozen_blocks: 2
  n_temporal_layers: 2
  n_heads: 8
  dropout: 0.25
  head_hidden: 1024

dataset:
  num_frames: 16

training:
  epochs: 20
  lr: 1.0e-4
  backbone_lr_scale: 0.05
  llrd_factor: 0.8
  batch_size: 2
  grad_accum_steps: 32     # effective batch = 64
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 3
  min_lr: 1.0e-7
  clip_grad_norm: 1.0
  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.8
  color_strength: 0.35
  blur_prob: 0.1
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.6
  use_mixup: true
  mixup_alpha: 0.4
