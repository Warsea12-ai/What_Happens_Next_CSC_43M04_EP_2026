# @package _global_
# TimeSformer-base-SSv2 v2 : 4 blocs frozen, LR baseline
# 3 archis SSv2-FT × 3 variantes — 20 epochs, 130W.
defaults:
  - override /model: timesformer_head

model:
  backbone: "facebook/timesformer-base-finetuned-ssv2"
  num_frozen_blocks: 4
  dropout: 0.25
  head_hidden: 1024

training:
  epochs: 20
  lr: 1.0e-4
  backbone_lr_scale: 0.05
  llrd_factor: 0.8
  batch_size: 4
  grad_accum_steps: 16
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 3
  min_lr: 1.0e-7
  clip_grad_norm: 1.0
  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.8
  color_strength: 0.35
  blur_prob: 0.1
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.6
  use_mixup: true
  mixup_alpha: 0.4
