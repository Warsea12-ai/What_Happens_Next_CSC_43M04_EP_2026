# @package _global_
# Push the unfreezing further on V-JEPA-G: num_frozen=16 (24 trainable blocks
# of 40 — that's 60% of the encoder trainable). Tighter batch needed
# (~3 should still fit 20GB with no_grad on frozen blocks).
defaults:
  - override /model: vjepa2_head

model:
  backbone: "facebook/vjepa2-vitg-fpc64-384-ssv2"
  num_frozen_blocks: 16       # was 24 in vjepa2_g_baseline → unfreeze 24/40
  dropout: 0.25
  head_hidden: 2048

training:
  epochs: 25
  lr: 3.0e-4
  backbone_lr_scale: 0.2
  llrd_factor: 0.80
  batch_size: 3               # tighter: more trainable blocks = more activations
  grad_accum_steps: 22        # effective batch ≈ 66
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 3
  min_lr: 1.0e-7
  clip_grad_norm: 1.0
  wandb_watch: false
  use_random_resized_crop: false
  use_augment: false
  color_prob: 0.0
  color_strength: 0.0
  blur_prob: 0.0
  flip_prob: 0.0
  use_temporal_map: false
  equivariant_reverse_prob: 0.0
  use_mixup: false
  mixup_alpha: 0.0
