# @package _global_
# SSv2 Base + temporal transformer head + LoRA rank=8.
# Combine les deux stratégies les plus prometteuses :
#   - temporal head (capture relations inter-frames)
#   - LoRA (adaptation efficace sans catastrophic forgetting SSv2)
# temporal_head_ssv2 utilise lora_rank=0 (pas de LoRA) — ici on l'active.
defaults:
  - override /model: videomae_temporal_head

model:
  backbone: "MCG-NJU/videomae-base-finetuned-ssv2"
  num_frozen_blocks: 6
  n_temporal_layers: 3
  n_heads: 8
  dropout: 0.3
  head_hidden: 1024
  lora_rank: 8
  lora_alpha: 16.0

training:
  epochs: 70
  lr: 2.0e-4
  backbone_lr_scale: 0.05
  batch_size: 16
  grad_accum_steps: 4
  weight_decay: 2.0e-4
  label_smoothing: 0.1
  warmup_epochs: 8
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.8
  color_strength: 0.3
  blur_prob: 0.1
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.6
  use_mixup: true
  mixup_alpha: 0.3
