# @package _global_
# [Super-combo #5] interp_repeat + dropout_15 + mixup + EMA + wd5e3.
# Pas de cw_valaware — test si la régularisation seule (sans rééquilibrage CE)
# atteint le même plafond. Permet d'isoler la contribution de cw_valaware.
defaults:
  - override /model: videomae_cross_attn_pairs
model:
  backbone: "MCG-NJU/videomae-base-finetuned-ssv2"
  num_frozen_blocks: 0
  n_temporal_layers: 2
  n_heads: 8
  dropout: 0.15
  head_hidden: 2048
  interp_mode: "repeat"
training:
  epochs: 20
  optimizer: prodigy
  lr: 1.0
  backbone_lr_scale: 0.5
  llrd_factor: 0.8
  batch_size: 8
  grad_accum_steps: 4
  weight_decay: 5.0e-3
  label_smoothing: 0.1
  warmup_epochs: 3
  min_lr: 1.0e-7
  clip_grad_norm: 1.0
  use_ema: true
  ema_decay: 0.999
  use_random_resized_crop: false
  use_augment: false
  color_prob: 0.0
  color_strength: 0.0
  blur_prob: 0.0
  flip_prob: 0.0
  use_temporal_map: false
  equivariant_reverse_prob: 0.0
  use_mixup: true
  mixup_alpha: 0.2
