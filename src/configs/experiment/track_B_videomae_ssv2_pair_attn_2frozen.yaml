# @package _global_
# VideoMAEPairAttn + fine-tuning style espagne (2 blocs gelés + LLRD 0.80).
#
# Innovation : combine l'architecture pair_attn (C(4,2)=6 paires temporelles +
# temporal self-attention) avec la recette d'entraînement optimale identifiée
# empiriquement : quasi full fine-tune + LLRD pour éviter le catastrophic forgetting.
#
# espagne (2frozen simple head) → 0.6513 training val_acc (meilleur à date).
# monaco  (pair_attn, 6frozen, LoRA) → 0.6123.
# Hypothèse : pair_attn + 2frozen + LLRD ≫ les deux séparément.
defaults:
  - override /model: videomae_pair_attn

model:
  backbone: "MCG-NJU/videomae-base-finetuned-ssv2"
  num_frozen_blocks: 2
  n_temporal_layers: 3
  n_heads: 8
  dropout: 0.25
  head_hidden: 1024
  lora_rank: 0        # direct fine-tune (pas de LoRA) — même stratégie qu'espagne
  lora_alpha: 1.0

training:
  epochs: 80
  lr: 1.0e-4
  backbone_lr_scale: 0.05
  llrd_factor: 0.80
  batch_size: 8
  grad_accum_steps: 8
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 10
  min_lr: 1.0e-7
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.8
  color_strength: 0.35
  blur_prob: 0.1
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.6
  use_mixup: true
  mixup_alpha: 0.4
