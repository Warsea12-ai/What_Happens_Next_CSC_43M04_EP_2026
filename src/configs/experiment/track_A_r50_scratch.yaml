# @package _global_
# Track A — R50 from scratch + motion head + 8 frames.
#
# We have R18(0.3766) and R152(0.4036) but not R50. R50 uses Bottleneck blocks
# (4× capacity per block vs BasicBlock) — more expressive than R18 but less
# prone to overfit than R152 on 44k samples. With the full augmentation recipe
# this may outperform R152 by regularizing better at medium depth.
defaults:
  - override /model: TSM_s

dataset:
  num_frames: 8

model:
  pretrained: false
  n_resnet_layers: 50
  fold_div: 8
  dropout: 0.45
  temporal_pool: motion
  use_frame_diff: true
  use_positional_encoding: true
  pe_mode: sinusoidal
  stochastic_depth: 0.20
  head_hidden: false

training:
  epochs: 120
  lr: 5.0e-4
  batch_size: 32
  weight_decay: 3.0e-4
  label_smoothing: 0.1
  warmup_epochs: 8
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.5
  color_strength: 0.15
  blur_prob: 0.0
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5
  use_mixup: true
  mixup_alpha: 0.6
