# @package _global_
# Variante centered ADAPTÉE pour fit 16GB (A4000 power140).
# Identique à _interp_centered sauf batch_size=4 (au lieu de 8) et
# grad_accum_steps=16 (au lieu de 8) → effective batch = 64 inchangée.
# Permet de relancer après le crash de roumanie (self-OOM à 15.3 GB/16 GB).
defaults:
  - override /model: videomae_cross_attn_pairs

model:
  backbone: "MCG-NJU/videomae-base-finetuned-ssv2"
  num_frozen_blocks: 0
  n_temporal_layers: 2
  n_heads: 8
  dropout: 0.25
  head_hidden: 2048
  interp_mode: "centered"

training:
  epochs: 20
  optimizer: prodigy
  lr: 1.0
  backbone_lr_scale: 0.5
  llrd_factor: 0.8
  batch_size: 4               # ← réduit pour fit 16GB
  grad_accum_steps: 16        # ← effective batch = 64 inchangé
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 3
  min_lr: 1.0e-7
  clip_grad_norm: 1.0
  use_random_resized_crop: false
  use_augment: false
  color_prob: 0.0
  color_strength: 0.0
  blur_prob: 0.0
  flip_prob: 0.0
  use_temporal_map: false
  equivariant_reverse_prob: 0.0
  use_mixup: false
  mixup_alpha: 0.0
