# @package _global_
# Track A — R152 + unidirectional temporal shift + 8 frames.
#
# Standard TSM shifts in BOTH directions: past→present (frame t-1 → t) and
# future→present (frame t+1 → t). This is appropriate for action recognition
# where context from both directions helps.
#
# But "what happens next" is a CAUSAL prediction task. Shifting future frames
# into past positions may create a shortcut: the model sees frame 3 features
# at frame 0's position and directly reads the answer, rather than learning
# temporal dynamics. Unidirectional shift (past→present only) removes this
# potential shortcut and forces the model to reason causally.
#
# unidirectional_shift=true: only fold channels shift forward in time.
# The freed channels (that would have shifted backward) are instead unchanged.
defaults:
  - override /model: TSM_s

dataset:
  num_frames: 8

model:
  pretrained: false
  n_resnet_layers: 152
  fold_div: 8
  dropout: 0.5
  temporal_pool: motion
  use_frame_diff: true
  use_positional_encoding: true
  pe_mode: sinusoidal
  stochastic_depth: 0.35
  head_hidden: false
  unidirectional_shift: true

training:
  epochs: 120
  lr: 5.0e-4
  batch_size: 16
  weight_decay: 5.0e-4
  label_smoothing: 0.15
  warmup_epochs: 8
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.5
  color_strength: 0.15
  blur_prob: 0.0
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5
  use_mixup: true
  mixup_alpha: 0.8
  use_cutmix: true
  cutmix_alpha: 1.0
