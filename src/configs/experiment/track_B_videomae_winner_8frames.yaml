# @package _global_
# Winner recipe (cw_valaware + repeat + EMA) avec 8 frames input (vs 4 par défaut).
# Hypothèse non testée : plus de frames → meilleure capture temporelle →
# meilleure généralisation val_dir. Earlier "frames_8" tests étaient sur baseline
# sans cw_valaware/EMA, donc combinaison nouvelle.
defaults:
  - override /model: videomae_cross_attn_pairs
dataset:
  num_frames: 8                  # was 4 — clé du test
model:
  backbone: "MCG-NJU/videomae-base-finetuned-ssv2"
  num_frozen_blocks: 0
  n_temporal_layers: 2
  n_heads: 8
  dropout: 0.25
  head_hidden: 2048
  interp_mode: "repeat"
training:
  epochs: 20
  optimizer: prodigy
  lr: 1.0
  backbone_lr_scale: 0.5
  llrd_factor: 0.8
  batch_size: 4                  # smaller batch car 8 frames double VRAM
  grad_accum_steps: 8            # eff_batch 32 maintenu
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 3
  min_lr: 1.0e-7
  clip_grad_norm: 1.0
  use_ema: true
  ema_decay: 0.999
  class_weights: "val_aware"
  use_random_resized_crop: false
  use_augment: false
  color_prob: 0.0
  color_strength: 0.0
  blur_prob: 0.0
  flip_prob: 0.0
  use_temporal_map: false
  equivariant_reverse_prob: 0.0
  use_mixup: false
  mixup_alpha: 0.0
