# @package _global_
# Track B — VideoMAE-Base fine-tuned on SSv2 (same domain as our challenge).
# Backbone is pretrained on Something-Something v2 with 174 classes; we replace
# the head with 33-class output and fine-tune the last 4 encoder blocks.
#
# Differential LR: last-4-block backbone at 1e-5, new head at 1e-4.
defaults:
  - override /model: videomae

model:
  num_frozen_blocks: 8   # fine-tune last 4 of 12 blocks (blocks 8-11)
  dropout: 0.3
  frames_repeat: 4       # 4 × 4 = 16 frames for VideoMAE

training:
  epochs: 30
  lr: 1.0e-4             # head LR
  backbone_lr_scale: 0.1 # fine-tuned blocks get 1e-5
  batch_size: 8          # 16 frames × 224² needs ~14GB; reduce to 4 if OOM
  weight_decay: 1e-4
  label_smoothing: 0.1
  warmup_epochs: 3       # short warmup — backbone already well pretrained
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true

  use_augment: true
  color_prob: 0.8
  color_strength: 0.3
  blur_prob: 0.1

  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5
