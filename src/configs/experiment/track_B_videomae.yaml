# @package _global_
# Track B — VideoMAE-Base fine-tuned on SSv2 (same domain as our challenge).
# Backbone is pretrained on Something-Something v2 with 174 classes; we replace
# the head with 33-class output and fine-tune the last 4 encoder blocks.
#
# Differential LR: last-4-block backbone at 1e-5, new head at 1e-4.
defaults:
  - override /model: videomae

model:
  num_frozen_blocks: 6   # fine-tune last 6 of 12 blocks — more capacity, SSv2 already in-domain
  dropout: 0.2
  frames_repeat: 4

training:
  epochs: 50
  lr: 5.0e-5             # lower head LR — SSv2 features already close to target
  backbone_lr_scale: 0.1 # fine-tuned blocks get 5e-6
  batch_size: 8
  grad_accum_steps: 4      # effective batch size = 32
  weight_decay: 5e-4     # stronger reg — head can overfit fixed backbone features
  label_smoothing: 0.1
  warmup_epochs: 5
  min_lr: 1.0e-7
  clip_grad_norm: 1.0

  use_random_resized_crop: true

  use_augment: true
  color_prob: 0.8
  color_strength: 0.3
  blur_prob: 0.1

  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5
