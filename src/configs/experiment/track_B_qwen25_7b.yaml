# @package _global_
# Track B — Qwen2.5-VL-7B visual encoder (frozen) + motion-aware head.
# Qwen2.5 differs from Qwen2 in pretraining data and alignment recipe.
# Vision encoder: 1280-dim tokens (same depth as 2B but newer training).
# head_hidden=768 is enough for 4×1280=5120 input.
defaults:
  - override /model: qwen25_7b

model:
  dropout: 0.4

training:
  epochs: 60
  lr: 3.0e-4
  backbone_lr_scale: 0.0
  batch_size: 16
  grad_accum_steps: 4      # effective batch = 64
  weight_decay: 1.0e-3
  label_smoothing: 0.15
  warmup_epochs: 5
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.8
  color_strength: 0.4
  blur_prob: 0.15

  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5
  temporal_jitter: 1
