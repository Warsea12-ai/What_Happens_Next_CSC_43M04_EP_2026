# @package _global_
# DIAGNOSE — Hypothèse "distribution shift train→val_dir" :
# réintroduire les augs fortes du baseline pour simuler la diversité de val_dir.
#
# Attendu : val/acc wandb ↘ massif (l'aug-off était précisément ce qui inflait
# le holdout), evaluate.py possiblement ↗ → gap ↘ fortement.
defaults:
  - override /model: videomae_cross_attn_pairs
model:
  backbone: "MCG-NJU/videomae-base-finetuned-ssv2"
  num_frozen_blocks: 0
  n_temporal_layers: 2
  n_heads: 8
  dropout: 0.25
  head_hidden: 2048
  interp_mode: "centered"
training:
  epochs: 20
  optimizer: prodigy
  lr: 1.0
  backbone_lr_scale: 0.5
  llrd_factor: 0.8
  batch_size: 8
  grad_accum_steps: 4
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 3
  min_lr: 1.0e-7
  clip_grad_norm: 1.0
  use_ema: true
  ema_decay: 0.997

  # Augs ON (vs OFF dans winner_triple)
  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.8
  color_strength: 0.35
  blur_prob: 0.1
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.6
  use_mixup: true
  mixup_alpha: 0.4
