# @package _global_
# Track A — TSM_s R34 + SSL backbone + motion head + class-balanced loss.
#
# Combines three best Track A ingredients never tried together:
#   1. SSL pretraining (track_A_tsm_r34_ssl_motion) — better backbone init
#   2. Class-balanced CE loss (track_A_tsm_motion_balanced) — fixes minority classes
#   3. Motion-aware head [global, first, last, delta] — explicit temporal direction
#
# Pretrain R34 backbone first (if not already done):
#   uv run python pretrain_ssl_trackA.py --arch resnet34 --use_tsm --multi_task \
#       --epochs 30 --out ssl_tsm_r34_backbone.pt
#
# Then fine-tune:
#   uv run python train.py experiment=track_A_tsm_r34_ssl_balanced
defaults:
  - override /model: TSM_s

model:
  n_resnet_layers: 34
  fold_div: 8
  dropout: 0.4
  temporal_pool: motion
  use_frame_diff: false      # must match SSL pretraining (3-channel conv1)
  use_positional_encoding: true
  pe_mode: sinusoidal
  stochastic_depth: 0.15
  head_hidden: false
  pretrained_backbone_path: ssl_tsm_r34_backbone.pt

training:
  epochs: 80
  lr: 2.0e-4
  batch_size: 64
  weight_decay: 3.0e-4
  label_smoothing: 0.1
  warmup_epochs: 5
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_class_weights: true

  use_random_resized_crop: true

  use_augment: true
  color_prob: 0.5
  color_strength: 0.15
  blur_prob: 0.0

  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5

  use_mixup: true
  mixup_alpha: 0.3
  use_cutmix: true
  cutmix_alpha: 0.4
