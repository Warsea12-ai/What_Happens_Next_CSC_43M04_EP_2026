# @package _global_
# Track A — cnn_frame_diff (from scratch), improved training
# Concatenates frame[t] || (frame[t] - frame[t-1]) as 6-channel input to ResNet18.
# The difference channels carry explicit pixel-level motion, which is a stronger
# temporal signal than anything computed at the feature level.
defaults:
  - override /model: cnn_frame_diff

model:
  pretrained: false
  use_frame_diff: true
  use_positional_encoding: true
  pe_mode: sinusoidal

training:
  epochs: 60
  lr: 3.0e-4
  batch_size: 64
  weight_decay: 1e-4
  label_smoothing: 0.1
  warmup_epochs: 5
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true
