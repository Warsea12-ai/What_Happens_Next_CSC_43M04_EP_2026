# @package _global_
# Track B — MotionVideoMAE with layer-wise LR decay.
#
# Architecture: VideoMAE-Base (SSv2-pretrained) + motion-aware head.
#   Head input: [global_pool, first_temporal, last_temporal, delta] (4×768)
#   delta = last_temporal_feat − first_temporal_feat = net motion direction
#   This directly encodes the temporal direction signal needed for reverse-pair classes.
#
# LLRD: backbone blocks decay geometrically from block 11 (backbone_lr) toward block 8.
#   block 11: 2e-5   block 10: 1.5e-5   block 9: 1.1e-5   block 8: 8.4e-6
defaults:
  - override /model: motion_videomae

model:
  num_frozen_blocks: 8
  dropout: 0.3

training:
  epochs: 40
  lr: 3.0e-4              # head + norm LR
  backbone_lr_scale: 0.067 # top block gets lr × 0.067 ≈ 2e-5
  llrd_factor: 0.75        # each block below gets × 0.75 of the one above
  batch_size: 16
  weight_decay: 5e-4
  label_smoothing: 0.1
  warmup_epochs: 5
  min_lr: 1.0e-6
  clip_grad_norm: 1.0

  use_random_resized_crop: true

  use_augment: true
  color_prob: 0.8
  color_strength: 0.3
  blur_prob: 0.1

  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.5
