# @package _global_
# VideoMAE-v2 Giant (1B params, frozen) + SOTA stack.
# Largest VideoMAE family ; untested with winning levers.
defaults:
  - override /model: videomaev2_giant_attn_pool
model:
  num_frozen_blocks: 40
  dropout: 0.15
  head_hidden: 4096
training:
  epochs: 25
  optimizer: prodigy
  lr: 1.0
  backbone_lr_scale: 0.0
  llrd_factor: 0.0
  batch_size: 2
  grad_accum_steps: 16
  weight_decay: 5.0e-4
  label_smoothing: 0.2
  warmup_epochs: 3
  min_lr: 1.0e-7
  clip_grad_norm: 1.0
  use_ema: true
  ema_decay: 0.999
  class_weights: "val_aware"
  use_random_resized_crop: false
  use_augment: false
  color_prob: 0.0
  color_strength: 0.0
  blur_prob: 0.0
  flip_prob: 0.0
  use_temporal_map: false
  equivariant_reverse_prob: 0.0
  use_mixup: false
  mixup_alpha: 0.0
