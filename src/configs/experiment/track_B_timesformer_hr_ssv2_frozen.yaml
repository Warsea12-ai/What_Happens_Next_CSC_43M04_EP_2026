# @package _global_
# TimesFormer-HR SSv2 (121M, 63.5% reported). 448x448, FROZEN variant.
# 448x448 demande plus de mémoire — batch=4 sur 20GB pour rester safe.
defaults:
  - override /model: timesformer_ssv2

model:
  variant: "frozen"
  backbone: "facebook/timesformer-hr-finetuned-ssv2"
  num_frames: 16
  image_size: 448
  head_hidden: 1024
  dropout: 0.3

training:
  epochs: 25
  lr: 5.0e-4
  batch_size: 2
  grad_accum_steps: 32
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 3
  min_lr: 1.0e-6
  clip_grad_norm: 1.0
  use_random_resized_crop: true
  use_augment: true
  color_prob: 0.6
  color_strength: 0.3
  blur_prob: 0.1
  flip_prob: 0.5
  use_temporal_map: true
  equivariant_reverse_prob: 0.6
  use_mixup: true
  mixup_alpha: 0.3
