training:
  use_augment: true
  flip_prob: 0.5
  crop_prob: 0.8
  crop_scale: [0.7, 1.0]
  temporal_reverse_prob: 0.0    # active à 0.5 SI tes classes sont symétriques en temps
  color_prob: 0.8
  color_strength: 0.4
  blur_prob: 0.3
  erase_prob: 0.25
  
  use_mixup: true
  mixup_alpha: 0.2
  
  label_smoothing: 0.1
  weight_decay: 5.0e-4