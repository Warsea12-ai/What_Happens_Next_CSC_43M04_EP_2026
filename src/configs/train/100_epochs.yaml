# @package _global_
training:
  batch_size: 8
  lr: 0.0001
  epochs: 100
  num_workers: 8
  # Where to save the best checkpoint (by validation accuracy)
  checkpoint_path: ${hydra:runtime.cwd}/best_model_${hydra:runtime.choices.experiment}.pt
  device: cuda

use_augment: true
color_prob: 0.8
color_strength: 0.4
blur_prob: 0.15
motion_blur_prob: 0.15
pixelation_prob: 0.15      # somme des 3 ≤ 1

flip_prob: 0.5

use_mixup: true
mixup_alpha: 0.2
